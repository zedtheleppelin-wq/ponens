<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponens – das Spiel der gültigen Schlüsse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (Echtzeit-Datenbank für Mehrspieler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e6e6eb;
  --chip:rgba(0,0,0,.055); --chip-h:rgba(0,0,0,.09);
  --accent:#0a66d8; --accent-soft:rgba(10,102,216,.16); --good:#1f9d55; --bad:#d93a3a;
  --t1:#fffaf0; --t2:#eedfbd; --tedge:#c8b184; --tink:#3b2e17;
  --o1:#ffc785; --o2:#f58a2a; --oedge:#c2600e; --oink:#4a2002;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 34px rgba(0,0,0,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --tA:48px; --D:130px; --cell:40px; --tm:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c30;
    --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
    --accent:#3b8cff; --accent-soft:rgba(59,140,255,.22); --good:#34c46e; --bad:#ff5a5a;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c30;
  --chip:rgba(255,255,255,.09); --chip-h:rgba(255,255,255,.14);
  --accent:#3b8cff; --accent-soft:rgba(59,140,255,.22); --good:#34c46e; --bad:#ff5a5a;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.screen.hidden{opacity:0;transform:scale(.97);pointer-events:none;visibility:hidden;transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* ---------- buttons ---------- */
.btn{font:inherit;font-size:15px;font-weight:600;letter-spacing:-.01em;border:0;border-radius:999px;padding:10px 18px;
  background:var(--chip);color:var(--ink);cursor:pointer;transition:transform .16s cubic-bezier(.3,1.5,.5,1),background .2s,opacity .2s;white-space:nowrap}
.btn:hover{background:var(--chip-h)}
.btn:active{transform:scale(.93)}
.btn.press{animation:press .32s ease}
@keyframes press{0%{transform:scale(1)}35%{transform:scale(.9)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{font-size:17px;padding:14px 34px;min-width:200px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;cursor:pointer;padding:8px}

/* ---------- tiles ---------- */
.tile{--s:var(--tA);width:var(--s);height:var(--s);flex:0 0 auto;border-radius:calc(var(--s)*.17);position:relative;display:grid;place-items:center;
  background:linear-gradient(155deg,var(--t1) 0%,var(--t2) 100%);color:var(--tink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.05),0 calc(var(--s)*.075) 0 var(--tedge),0 calc(var(--s)*.13) calc(var(--s)*.2) rgba(60,40,10,.25);
  font-weight:650;font-size:calc(var(--s)*.46);line-height:1;cursor:grab;touch-action:none;
  transition:transform .28s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,opacity .25s}
.tile .g{transform:translateY(-4%)}
.tile.two .g{font-size:calc(var(--s)*.36);letter-spacing:-.03em}
.tile .v{position:absolute;right:11%;bottom:8%;font-size:calc(var(--s)*.21);font-weight:600;opacity:.6}
.tile .bar{display:block;width:62%;height:calc(var(--s)*.1);border-radius:9px;background:currentColor;transform:translateY(-4%)}
.tile.orange{background:linear-gradient(155deg,var(--o1) 0%,var(--o2) 100%);color:var(--oink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(0,0,0,.06),0 calc(var(--s)*.075) 0 var(--oedge),0 calc(var(--s)*.13) calc(var(--s)*.2) rgba(120,50,0,.28)}
.tile.glitter::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 45%,rgba(255,230,140,.6) 50%,transparent 64%);
  background-size:260% 100%;animation:sheen 2.6s ease-in-out infinite}
.tile.glitter .g::after{content:"✦";position:absolute;left:12%;top:9%;font-size:calc(var(--s)*.2);color:#e0a400;text-shadow:0 0 6px rgba(255,210,60,.9)}
@keyframes sheen{0%{background-position:140% 0}60%,100%{background-position:-40% 0}}
.tile.sel{z-index:5;animation:wobble 1.6s ease-in-out infinite;box-shadow:0 0 0 3px var(--accent),0 calc(var(--s)*.25) calc(var(--s)*.4) rgba(0,0,0,.3)}
@keyframes wobble{0%,100%{transform:scale(1.18) rotate(-9deg)}50%{transform:scale(1.18) rotate(9deg)}}
.tile.lifted{opacity:.25;animation:none}
.tile.exsel{transform:translateY(-22%);box-shadow:0 0 0 3px var(--accent),0 8px 16px rgba(0,0,0,.25)}
.tile.fresh{animation:fresh .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes fresh{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.slot{width:var(--tA);height:var(--tA);flex:0 0 auto;border-radius:calc(var(--tA)*.17);border:1.5px dashed var(--line)}
.dragclone{position:fixed;z-index:80;pointer-events:none;margin:0;left:0;top:0;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.28));transition:none}

/* ---------- start ---------- */
#start .hero{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:34px;--tA:50px;position:relative}
#start .hrow{display:flex;gap:6px}
#start .hstroke{height:5px;border-radius:3px;background:var(--ink);width:0;align-self:stretch;transition:width .6s cubic-bezier(.6,0,.2,1)}
#start .hero.drawn .hstroke{width:100%}
#start h1{font-size:clamp(44px,9vw,76px);font-weight:800;letter-spacing:-.045em;margin:0 0 6px}
#start p.sub{font-size:clamp(16px,2.4vw,20px);color:var(--muted);margin:0 0 36px;max-width:34ch;line-height:1.4}
#start .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.hero .tile{opacity:0;cursor:default}
.hero .tile.in{animation:drop .55s cubic-bezier(.25,1.5,.5,1) forwards}
.hero .tile.shine::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.98) 48%,rgba(255,255,255,.98) 52%,transparent 70%);background-size:320% 100%;
  animation:shine .9s var(--d) ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-12deg)}to{opacity:1;transform:none}}

/* ---------- setup ---------- */
#setup h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.035em;margin:0 0 8px}
#setup .hint{color:var(--muted);margin:0 0 28px}
.seg-ctl{display:inline-flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;margin-bottom:28px}
.seg-ctl button{font:inherit;font-size:20px;font-weight:700;width:72px;height:52px;border:0;border-radius:11px;background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,transform .15s,box-shadow .25s}
.seg-ctl button.on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg-ctl button:active{transform:scale(.92)}
.names{display:grid;gap:10px;width:min(340px,86vw);margin-bottom:28px}
.names label{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:4px 14px;box-shadow:var(--shadow);animation:fadeUp .35s ease both}
.names .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.names input{font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);padding:12px 0;width:100%;outline:none;user-select:text}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- game ---------- */
#boardHolder{position:absolute;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1.15)}
#boardHolder.pre{opacity:0;transform:scale(.9)}
#boardRot{position:absolute;inset:0;transform-origin:50% 50%}
#boardCard{position:absolute;inset:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:8px}
#board{position:relative;display:grid;grid-template-columns:repeat(12,var(--cell));grid-auto-rows:var(--cell);gap:1px;background:var(--line);border-radius:8px;overflow:hidden}
#board.strichmode{background:var(--accent-soft)}
.cell{background:var(--card);position:relative;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.cell .tile{--s:calc(var(--cell) - 4px);border-radius:calc(var(--s)*.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 calc(var(--s)*.06) 0 var(--tedge),0 calc(var(--s)*.1) calc(var(--s)*.14) rgba(60,40,10,.22)}
.cell .tile.orange{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 calc(var(--s)*.06) 0 var(--oedge),0 calc(var(--s)*.1) calc(var(--s)*.14) rgba(120,50,0,.25)}
.cell .tile.tent{outline:2.5px solid var(--accent);outline-offset:1px}
.cell .tile:not(.tent){cursor:default}
/* Wo passt der gehaltene Stein? */
.cell.ok::before{content:"";width:14%;height:14%;border-radius:50%;background:var(--accent);opacity:.18;transition:transform .2s}
.cell.ok.near::before{width:26%;height:26%;opacity:.5}
.cell.no{background:color-mix(in srgb,var(--card) 88%,var(--ink))}
.cell.over{z-index:4;animation:pulse .9s ease-in-out infinite;border-radius:6px}
.cell.over.ok::before{transform:scale(1.8);opacity:.7}
.cell.over.no{box-shadow:0 0 0 3px var(--bad)!important}
@keyframes pulse{0%,100%{transform:scale(1.08);box-shadow:0 0 0 3px var(--accent)}50%{transform:scale(1.16);box-shadow:0 0 0 6px var(--accent-soft)}}
.cell.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.cell.place .tile{animation:placed .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes placed{from{transform:scale(1.4);opacity:.5}to{transform:none;opacity:1}}
.cell.polish{z-index:3}
.cell.polish .tile{animation:polishPop .75s var(--d) cubic-bezier(.3,1.6,.5,1) both}
.cell.polish .tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.98) 48%,rgba(255,255,255,.98) 52%,transparent 70%);background-size:320% 100%;
  animation:shine .8s var(--d) ease-out both}
@keyframes shine{from{background-position:140% 0}to{background-position:-40% 0}}
@keyframes polishPop{0%{transform:none}40%{transform:scale(1.22) rotate(-5deg)}70%{transform:scale(.95) rotate(1deg)}100%{transform:none}}
#lines{position:absolute;inset:8px;pointer-events:none;z-index:10}
.stroke{position:absolute;height:5px;margin-top:-2.5px;background:var(--ink);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.stroke.pending{background:var(--accent);height:6px;margin-top:-3px;box-shadow:0 0 12px 2px var(--accent-soft);pointer-events:auto;cursor:pointer;animation:drawIn .45s cubic-bezier(.6,0,.2,1) both;transform-origin:left}
.stroke.fresh{animation:drawIn .45s cubic-bezier(.6,0,.2,1) both;transform-origin:left}
@keyframes drawIn{from{transform:scaleX(0)}to{transform:none}}
/* große Trefferfläche: eine ganze Zellenhöhe um die Linie */
.seg{position:absolute;height:var(--cell);margin-top:calc(var(--cell)/-2);pointer-events:auto;cursor:pointer;border-radius:8px}
.seg::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 3px);height:6px;border-radius:3px;background:var(--accent);
  box-shadow:0 0 12px 3px var(--accent);animation:glow 1.1s ease-in-out infinite}
.seg.over{background:var(--accent-soft)}
.seg.over::after{height:9px;top:calc(50% - 4.5px);animation:none}
@keyframes glow{50%{opacity:.45;box-shadow:0 0 4px 1px var(--accent)}}

.rackwrap .head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted)}
.rackwrap.active .head{color:var(--ink)}
.rackwrap .dot{width:9px;height:9px;border-radius:50%}
.rackwrap .sc{font-variant-numeric:tabular-nums;background:var(--chip);border-radius:999px;padding:2px 9px;color:var(--ink);font-weight:700;min-width:34px;text-align:center;display:inline-block}
.rackwrap .sc.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.45);background:var(--accent);color:#fff}}
.rackwrap .row{display:flex;align-items:center;gap:12px}
.rack{display:flex;gap:5px;padding:7px 9px 10px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.rackwrap.active .rack{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:36px}
.controls .btn{font-size:14px;padding:8px 14px}
.controls .note{font-size:14px;color:var(--muted);padding:0 6px}
.status{font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--chip);color:var(--muted)}
.status.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.btn.icon{padding:8px 13px;font-size:16px}
.coach-hl{position:relative;z-index:6;animation:hl 1.3s ease-in-out infinite!important}
@keyframes hl{0%,100%{box-shadow:0 0 0 3px var(--accent),0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 3px var(--accent),0 0 0 12px var(--accent-soft)}}

#hud{position:fixed;inset:0;pointer-events:none;z-index:30}
#toasts{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(440px,90%)}
.toast{background:var(--card);color:var(--ink);border-radius:16px;padding:11px 16px;box-shadow:0 6px 26px rgba(0,0,0,.18);font-size:14.5px;line-height:1.4;
  text-align:center;animation:toastIn .38s cubic-bezier(.3,1.4,.5,1) both;pointer-events:auto}
.toast b{display:block;color:var(--accent);font-size:13px;margin-bottom:2px}
.toast.out{animation:toastOut .3s ease forwards}
.toast.turn{background:var(--ink);color:var(--bg);font-weight:600}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.burst{position:fixed;width:190px;height:190px;margin:-95px 0 0 -95px;display:grid;place-items:center;text-align:center;
  background:#ffd60a;color:#1d1d1f;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-size:19px;padding:40px;
  clip-path:polygon(50% 0,58% 17%,75% 7%,74% 26%,93% 25%,84% 42%,100% 50%,84% 58%,93% 75%,74% 74%,75% 93%,58% 83%,50% 100%,42% 83%,25% 93%,26% 74%,7% 75%,16% 58%,0 50%,16% 42%,7% 25%,26% 26%,25% 7%,42% 17%);
  filter:drop-shadow(0 4px 0 #1d1d1f)}
.burst span{display:block;font-size:30px;margin-top:4px}
.flyscore{position:fixed;font-weight:800;font-size:26px;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.15);margin:-16px 0 0 -24px}
.spark{position:fixed;color:#ffc400;font-size:22px;text-shadow:0 0 8px rgba(255,200,0,.9)}

#topbar{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;pointer-events:none;z-index:20}
#topbar>*{pointer-events:auto}
#topbar .r{display:flex;gap:8px;align-items:center}
#bagInfo{font-size:13px;color:var(--muted);font-weight:600;background:var(--chip);border-radius:999px;padding:7px 12px}

#strip,#dock{position:absolute;left:50%;transform:translateX(-50%);width:min(780px,100%);display:flex}
#strip{flex-direction:column;gap:4px;padding:0 10px;--tA:var(--tm)}
#strip .rackwrap{display:flex;align-items:center;justify-content:space-between;gap:8px;opacity:.92}
#strip .rack{padding:3px 5px 5px;border-radius:9px;gap:3px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#strip .head{font-size:13px}
#dock{bottom:0;justify-content:center}
#dock .rackwrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 8px 10px;width:100%}
#dock .controls{flex-wrap:nowrap}
#dock .controls .btn.end{flex:1;max-width:260px;padding:12px}
#dock .rack{padding:6px 7px 9px;gap:4px}

#coach{position:fixed;z-index:40;width:min(380px,calc(100vw - 24px));background:var(--card);border-radius:20px;box-shadow:0 12px 44px rgba(0,0,0,.22);padding:18px 18px 14px;
  transition:opacity .35s,transform .35s cubic-bezier(.3,1.3,.5,1)}
#coach.hidden{opacity:0;transform:translateY(10px) scale(.97);pointer-events:none}
#coach .ct{font-weight:700;font-size:18px;letter-spacing:-.02em;margin-bottom:6px}
#coach .cx{font-size:15px;line-height:1.5;color:var(--ink)}
#coach .cx ul{margin:6px 0 0;padding-left:18px}
#coach .cx li{margin:4px 0}
#coach .cmini{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin:12px 0 2px;--tA:32px}
#coach .cmini .r{display:flex;gap:4px}
#coach .cmini .tile{cursor:default}
#coach .cmini .ln{height:3px;background:var(--ink);border-radius:2px;width:112px}
#coach .cbtns{display:flex;align-items:center;gap:8px;margin-top:14px}
#coach .cstep{flex:1;display:flex;gap:6px}
#coach .cstep i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#coach .cstep i.on{background:var(--accent)}
#coach .cbtns .btn{font-size:14px;padding:9px 16px}
#coach.anim{animation:coachIn .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes coachIn{from{opacity:.4;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}

#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;transition:opacity .3s}
#modal.hidden{opacity:0;pointer-events:none}
.sheet{background:var(--card);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:24px;width:min(440px,100%);max-height:86vh;overflow:auto;
  animation:sheetIn .4s cubic-bezier(.3,1.3,.5,1);user-select:text}
@keyframes sheetIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.sheet h3{margin:0 0 14px;font-size:22px;letter-spacing:-.03em}
.sheet h4{margin:18px 0 6px;font-size:15px}
.sheet .stack{display:grid;gap:8px}
.sheet .stack .btn{width:100%;padding:13px}
.sheet ul{padding-left:20px;line-height:1.5;font-size:14.5px;margin:0 0 14px}
.sheet li{margin:4px 0}
.sheet p{font-size:14.5px;line-height:1.5;margin:0 0 12px;color:var(--muted)}
.sheet .cmini{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin:4px 0 14px;--tA:30px}
.sheet .cmini .r{display:flex;gap:4px}
.sheet .cmini .ln{height:3px;background:var(--ink);border-radius:2px;width:104px}
.rank{display:grid;gap:8px;margin-bottom:18px}
.rank div{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:600;animation:fadeUp .4s ease both}
.rank div:first-child{background:var(--accent);color:#fff}
.rank .p{margin-left:auto;font-variant-numeric:tabular-nums}

#orient{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;place-items:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}
#orient.show{display:grid}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- v3: online ---------- */
#strip .rackwrap{padding:3px 8px;border-radius:12px;transition:background .3s}
#strip .rackwrap.active{background:var(--accent-soft)}
#strip .rackwrap.active .rack{animation:bob 2.6s ease-in-out infinite}
.rackwrap .you{font-weight:500;color:var(--muted)}
.cell .tile.draft{outline:2px dashed var(--muted);outline-offset:1px;opacity:.85;cursor:default}
.waiting{font-size:14.5px;color:var(--muted);padding:8px 4px}
.waiting .dots i{display:inline-block;animation:dot 1.2s infinite;font-style:normal}
.waiting .dots i:nth-child(2){animation-delay:.2s}.waiting .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.panel{width:min(440px,92vw);display:flex;flex-direction:column;gap:14px;text-align:left}
.panel h2{font-size:clamp(28px,5vw,38px);letter-spacing:-.035em;margin:0 0 4px;text-align:center}
.panel .lead{color:var(--muted);margin:0 0 8px;text-align:center;line-height:1.45}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:4px 14px;box-shadow:var(--shadow)}
.field span{font-size:14px;color:var(--muted);white-space:nowrap}
.field input{font:inherit;font-size:16px;border:0;background:transparent;color:var(--ink);padding:12px 0;width:100%;outline:none;user-select:text}
.list{display:grid;gap:8px}
.list h3{font-size:14px;color:var(--muted);font-weight:600;margin:8px 4px 0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);animation:fadeUp .3s ease both}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:13px}
.item .btn{padding:8px 14px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:6px 4px;line-height:1.45}
.note-box{background:var(--chip);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--ink)}
.code{font-size:44px;font-weight:800;letter-spacing:.18em;text-align:center;margin:4px 0}
.pl{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-weight:600;animation:fadeUp .3s ease both}
.pl .dot{width:10px;height:10px;border-radius:50%}
.pl small{margin-left:auto;color:var(--muted);font-weight:500}
.center-btns{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.scroll{overflow-y:auto;justify-content:flex-start;padding-top:max(40px,8vh)}
/* ---------- v4: Tafeln ---------- */
:root{--table:#e9e9ee;--slot:rgba(0,0,0,.045);--gold1:#fff1c2;--gold2:#f1cf6a;--goldedge:#c79a1e;--goldslot:#f8e9b8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--table:#141416;--slot:rgba(255,255,255,.06);--goldslot:rgba(241,207,106,.22)}}
:root[data-theme="dark"]{--table:#141416;--slot:rgba(255,255,255,.06);--goldslot:rgba(241,207,106,.22)}
#boardCard{padding:0;background:var(--table);border-radius:22px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
#board{position:relative;display:block;width:100%;height:100%;background:none;gap:0;border-radius:0;overflow:visible}
.tafel{position:absolute;background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.07);
  padding:0 var(--pad) var(--pad);display:flex;flex-direction:column;transition:box-shadow .3s,transform .3s}
.tbadge{height:var(--badge);margin-bottom:var(--pad);display:flex;align-items:flex-end;gap:5px;font-size:calc(var(--badge)*.56);color:var(--muted);white-space:nowrap;overflow:hidden}
.tbadge b{color:var(--ink);font-weight:650}
.tbadge .lvl{margin-left:auto;background:var(--goldslot);color:#8a6400;border-radius:999px;padding:0 7px;font-weight:650}
.tbody{display:flex;flex-direction:column;gap:4px}
.trow{display:flex;gap:3px;height:var(--cell);border-radius:8px;transition:opacity .25s,box-shadow .2s;cursor:pointer}
.tslot{width:var(--cell);height:var(--cell);flex:0 0 auto;border-radius:7px;background:var(--slot);display:grid;place-items:center;position:relative}
.trow.concl .tslot{background:var(--accent-soft)}
.trow.gold .tslot{background:var(--goldslot)}
.trow.can{box-shadow:0 0 0 2px var(--accent-soft)}
.trow.can .tslot:empty{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.trow.cant{opacity:.35}
.trow.aging{opacity:.5}
.trow.aging .tile{filter:saturate(.3)}
.trow.shake{animation:shake .45s ease}
.tline{height:calc(var(--lgap) - 4px);position:relative}
.tline::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:2.5px dashed var(--muted);opacity:.45;transform:translateY(-50%)}
.tafel.solved .tline::after{border-top:4px solid var(--ink);opacity:1;animation:drawIn .45s cubic-bezier(.6,0,.2,1) both;transform-origin:left}
.tslot .tile{--s:calc(var(--cell) - 2px);border-radius:calc(var(--s)*.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 calc(var(--s)*.06) 0 var(--tedge),0 calc(var(--s)*.1) calc(var(--s)*.14) rgba(60,40,10,.22)}
.tslot .tile.orange{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 calc(var(--s)*.06) 0 var(--oedge),0 calc(var(--s)*.1) calc(var(--s)*.14) rgba(120,50,0,.25)}
.tile.emo .g{font-size:calc(var(--s)*.56);transform:translateY(-3%)}
.tile.emo .v{display:none}
.tile.tent{outline:2.5px solid var(--accent);outline-offset:1px}
.tile.draft{outline:2px dashed var(--muted);outline-offset:1px}
.tile.ghost{opacity:.55;pointer-events:none}
.tile.ghost.bad{opacity:.7;outline:2.5px solid var(--bad)}
.tile.goldtile,.tslot .tile.goldtile{background:linear-gradient(155deg,var(--gold1),var(--gold2));color:#4a3500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 calc(var(--s)*.06) 0 var(--goldedge),0 calc(var(--s)*.1) calc(var(--s)*.14) rgba(120,80,0,.25);cursor:default}
.tile.pop{animation:placed .4s cubic-bezier(.3,1.7,.5,1)}
.tile.polish{animation:polishPop .75s var(--d) cubic-bezier(.3,1.6,.5,1) both}
.tile.polish::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.98) 48%,rgba(255,255,255,.98) 52%,transparent 70%);background-size:320% 100%;
  animation:shine .8s var(--d) ease-out both}
.tafel.solved{z-index:3;box-shadow:0 0 0 3px #ffd60a,0 10px 30px rgba(0,0,0,.18)}
.tafel.condense .trow.gold .tile,.tafel.condense .trow.fixed .tile{animation:condense .65s cubic-bezier(.3,1.5,.5,1) both}
@keyframes condense{from{transform:translateY(calc(var(--cell)*2)) scale(1.15);opacity:.3}to{transform:none;opacity:1}}
/* Endgegner */
.tafel.type-boss{background:linear-gradient(160deg,#2a1f45,#43306b);box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 26px rgba(67,48,107,.35)}
.type-boss .tbadge,.type-boss .tbadge b{color:#efe7ff}
.type-boss .tslot{background:rgba(255,255,255,.1)}
.type-boss .trow.fixed .tslot{background:rgba(255,214,10,.22)}
.type-boss .tline::after{border-color:#d9ccff}
.type-boss .trow.cant{opacity:.45}
.tafel.type-komplex{box-shadow:0 0 0 1.5px var(--accent-soft),0 6px 18px rgba(0,0,0,.07)}
.moves{font-size:12px;font-weight:600;color:var(--muted);background:var(--chip);border-radius:999px;padding:2px 9px;margin-left:4px}
#coach.dim{opacity:.25;pointer-events:none}
.story{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.toast.story{font-size:15px;font-style:italic}
/* ---------- v5: Vorgaben, Level, Blitz, Teams ---------- */
.tslot.ok::before{content:"";width:22%;height:22%;border-radius:50%;background:var(--accent);opacity:.45}
.tile.fixedtile{background:linear-gradient(155deg,#eceef2,#d5d9e0);color:#3d4350;cursor:default;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 calc(var(--s)*.05) 0 #aeb4bf,0 calc(var(--s)*.08) calc(var(--s)*.12) rgba(0,0,0,.15)}
.tile.fixedtile .v{display:none}
.tafel.done{box-shadow:0 0 0 2.5px #e8c547,0 6px 18px rgba(0,0,0,.08)}
.tafel.done .tline::after{border-top:4px solid var(--ink);opacity:1}
.tafel.done .tbadge b{color:#a47a00}
.tafel.done .tbadge .lvl{background:var(--goldslot)}
.tafel.solving{z-index:3;box-shadow:0 0 0 3px #ffd60a,0 10px 30px rgba(0,0,0,.18)}
.tafel.solving .tline::after{border-top:4px solid var(--ink);opacity:1;animation:drawIn .45s cubic-bezier(.6,0,.2,1) both;transform-origin:left}
.tafel.boss{background:linear-gradient(160deg,#2a1f45,#43306b);box-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 26px rgba(67,48,107,.35)}
.boss .tbadge,.boss .tbadge b{color:#efe7ff}
.boss .tslot{background:rgba(255,255,255,.1)}
.boss .trow.locked .tslot{background:rgba(255,214,10,.22)}
.boss .tline::after{border-color:#d9ccff}
.tafel.boss.done{box-shadow:0 0 0 3px #e8c547,0 10px 26px rgba(67,48,107,.35)}
.tafel.kind-chain,.tafel.kind-oder{box-shadow:0 0 0 1.5px var(--accent-soft),0 6px 18px rgba(0,0,0,.07)}
#boardHolder.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;border-radius:22px}
#boardRot{position:absolute;left:0;right:0;top:0;bottom:auto}
#boardCard{position:relative;inset:auto;width:100%}
#topbar .mid{position:absolute;left:50%;transform:translateX(-50%);font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center;pointer-events:none}
#topbar .mid b{color:var(--ink)}
#topbar .prog{background:var(--chip);border-radius:999px;padding:2px 8px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:460px){#topbar .mid .nm{display:none}#topbar .mid{font-size:12.5px}#bagInfo{font-size:12px;padding:6px 9px}}
.moves.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.timer{position:relative;flex:1;min-width:180px;max-width:320px;height:40px;border-radius:999px;background:var(--chip);overflow:hidden;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.timer .bar{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff9f0a,#ffd60a);transition:width .2s linear}
.timer span{position:relative}
.burst small{display:block;font-size:13px;font-weight:700;margin-top:2px}
.ticon{font-size:15px;line-height:1}
.teambar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:2px}
.tchip{font-size:13px;background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap}
.tchip.mine{background:var(--accent-soft)}
.tchip b{font-variant-numeric:tabular-nums}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.team{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team.mine{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.team .th{display:flex;align-items:center;gap:6px}
.team .th span{font-size:20px}.team .th small{margin-left:auto;color:var(--muted)}
.team .tm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .tm.empty{color:var(--muted);font-weight:400}
.team .btn{padding:6px 10px;font-size:13px;margin-top:auto}
.toggle{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.rank small{display:block;font-size:12px;font-weight:500;opacity:.8}

#bagInfo:empty{display:none}
/* =========================================================
   v6: Altes Holzbrett
   ========================================================= */
:root{
  --bg:#efe5d2;--card:#fbf5ea;--ink:#2d2016;--muted:#806b55;--line:#dccbb0;
  --chip:rgba(92,58,30,.09);--chip-h:rgba(92,58,30,.15);
  --accent:#2f6d52;--accent-soft:rgba(47,109,82,.2);--good:#2f7d52;--bad:#b8432f;
  --walnut:#5a3a1f;--brass1:#f3d58b;--brass2:#c99a3e;--brassline:#d8ae55;
  --wood-a:#c58e55;--wood-b:#ae7540;--wood-c:#9a6230;--carve:rgba(52,26,6,.24);
  --shadow:0 1px 2px rgba(60,35,10,.08),0 10px 30px rgba(60,35,10,.12);
  --serif:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110b;--card:#241a11;--ink:#f3e8d6;--muted:#b49c80;--line:#3a2b1d;--chip:rgba(243,232,214,.08);--chip-h:rgba(243,232,214,.14);
  --accent:#6cc39a;--accent-soft:rgba(108,195,154,.22);--walnut:#e8c98f;
  --wood-a:#7a5130;--wood-b:#664224;--wood-c:#55361c;--carve:rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#17110b;--card:#241a11;--ink:#f3e8d6;--muted:#b49c80;--line:#3a2b1d;--chip:rgba(243,232,214,.08);--chip-h:rgba(243,232,214,.14);
  --accent:#6cc39a;--accent-soft:rgba(108,195,154,.22);--walnut:#e8c98f;
  --wood-a:#7a5130;--wood-b:#664224;--wood-c:#55361c;--carve:rgba(0,0,0,.35);}
body{background:
  radial-gradient(1200px 800px at 50% -10%,rgba(255,255,255,.35),transparent 60%),
  repeating-linear-gradient(45deg,rgba(120,80,40,.025) 0 2px,transparent 2px 6px),var(--bg)}
#start h1,#setup h2,.panel h2,.sheet h3,#coach .ct{font-family:var(--serif);letter-spacing:-.02em;font-weight:700}
.btn.primary{background:var(--walnut);color:#fbf1df}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#2a1a0c}}
.rank div:first-child{background:var(--walnut);color:#fbf1df}

/* ---- das Brett ---- */
#boardCard{border-radius:20px;
  background:
    radial-gradient(ellipse 60px 24px at 18% 72%,rgba(70,35,8,.28),rgba(70,35,8,.12) 40%,transparent 70%),
    radial-gradient(ellipse 40px 16px at 83% 18%,rgba(70,35,8,.22),transparent 70%),
    repeating-linear-gradient(91deg,rgba(255,235,200,.05) 0 1px,transparent 1px 7px,rgba(60,30,5,.05) 7px 8px,transparent 8px 19px),
    repeating-linear-gradient(89.3deg,rgba(60,30,5,.10) 0 1.5px,transparent 1.5px 31px),
    linear-gradient(178deg,var(--wood-a),var(--wood-b) 55%,var(--wood-c));
  box-shadow:inset 0 1px 0 rgba(255,230,190,.35),inset 0 0 0 1px rgba(60,30,5,.45),inset 0 -6px 14px rgba(50,25,5,.25),
    0 3px 0 #6b4320,0 18px 36px rgba(60,30,5,.35)}
#boardHolder.scroll{border-radius:20px}

/* ---- eingeschnitzte Sektionen ---- */
.tafel,.tafel.kind-chain,.tafel.kind-oder{background:var(--carve);border-radius:12px;
  box-shadow:inset 0 3px 7px rgba(40,18,2,.5),inset 0 -1px 0 rgba(255,228,185,.28),0 1px 0 rgba(255,228,185,.28)}
.tbadge{font-family:var(--serif);font-size:calc(var(--badge)*.62);color:rgba(48,22,4,.82);text-shadow:0 1px 0 rgba(255,228,185,.35);letter-spacing:.01em}
.tbadge b{color:rgba(40,16,2,.95);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tbadge,:root:not([data-theme="light"]) .tbadge b{color:#f0dcbc;text-shadow:0 -1px 0 rgba(0,0,0,.5)}}
.tslot{background:rgba(48,22,4,.22);border-radius:7px;
  box-shadow:inset 0 2px 3px rgba(30,12,0,.55),0 1px 0 rgba(255,228,185,.22)}
.trow.concl .tslot{background:rgba(48,22,4,.22);box-shadow:inset 0 2px 3px rgba(30,12,0,.55),inset 0 0 0 1.5px var(--brassline),0 1px 0 rgba(255,228,185,.22)}
.tslot.nar::after{content:"¬";font-family:var(--serif);font-weight:700;font-size:calc(var(--cell)*.42);color:rgba(40,16,2,.32);position:absolute}
.tslot.nar:has(.tile)::after{display:none}
.tslot.emo-slot:empty::after{content:"";width:28%;height:28%;border-radius:50%;border:1.5px dashed rgba(40,16,2,.28);position:absolute}
.tslot.ok::before{background:var(--accent);opacity:.7;width:24%;height:24%;z-index:1}
.tslot.ok.emo-slot::after{display:none}
.trow.can{box-shadow:0 0 0 2px rgba(47,109,82,.55);border-radius:9px}
.trow.cant{opacity:.45}
.trow{gap:4px}
/* Rille statt Linie */
.tline::after{border:0;height:3px;border-radius:2px;background:rgba(40,16,2,.55);box-shadow:0 1px 0 rgba(255,228,185,.3);opacity:1;top:50%;transform:translateY(-50%)}
.tafel.done .tline::after,.tafel.solving .tline::after{border:0;height:4px;background:linear-gradient(90deg,var(--brass2),var(--brass1),var(--brass2));box-shadow:0 0 6px rgba(243,213,139,.6)}
/* Vorgaben: ins Holz gebrannt */
.tile.fixedtile,.tslot .tile.fixedtile{background:linear-gradient(160deg,#e2b47a,#cd9a5f);color:#3b2210;
  box-shadow:inset 0 1px 0 rgba(255,236,200,.6),inset 0 -2px 3px rgba(80,40,8,.35),0 1px 1px rgba(40,18,2,.35)}
.tile.fixedtile .g{font-family:var(--serif);font-weight:700}
.tile.fixedtile.emo .g{filter:saturate(.85)}
.tslot.nar .tile{--s:calc(var(--cell)*.62 - 2px)}
.tslot.op .tile{--s:calc(var(--cell)*.74 - 2px)}
/* Gelöst: Messingschild */
.tafel.done{box-shadow:inset 0 3px 7px rgba(40,18,2,.5),inset 0 0 0 2px rgba(216,174,85,.55),0 1px 0 rgba(255,228,185,.28)}
.tafel.done .tbadge b{color:#3a2508;background:linear-gradient(180deg,var(--brass1),var(--brass2));padding:1px 8px;border-radius:4px;box-shadow:0 1px 0 rgba(60,30,5,.4),inset 0 1px 0 rgba(255,255,255,.5);font-size:.95em}
.tafel.done .tbadge .lvl{background:none;color:rgba(40,16,2,.7);font-weight:600}
.tafel.solving{box-shadow:inset 0 3px 7px rgba(40,18,2,.5),0 0 0 3px #ffd60a,0 0 24px rgba(255,214,10,.45)}
/* Endgegner: dunkle Ebenholz-Einlage */
.tafel.boss{background:linear-gradient(160deg,rgba(28,14,4,.78),rgba(45,24,8,.72));
  box-shadow:inset 0 3px 8px rgba(0,0,0,.6),inset 0 0 0 2px rgba(216,174,85,.45),0 1px 0 rgba(255,228,185,.28)}
.boss .tbadge,.boss .tbadge b{color:var(--brass1);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.boss .tslot{background:rgba(255,236,200,.07);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 1px 0 rgba(255,228,185,.12)}
.boss .tslot.nar::after{color:rgba(243,213,139,.35)}
.boss .tslot.emo-slot:empty::after{border-color:rgba(243,213,139,.3)}
.boss .tline::after{background:rgba(0,0,0,.6);box-shadow:0 1px 0 rgba(243,213,139,.2)}
.boss .trow.locked .tslot{background:rgba(243,213,139,.12);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),inset 0 0 0 1.5px var(--brassline)}
.tafel.boss.done{box-shadow:inset 0 3px 8px rgba(0,0,0,.6),inset 0 0 0 2.5px var(--brass1)}
.tile.goldtile,.tslot .tile.goldtile{background:linear-gradient(155deg,var(--brass1),var(--brass2));color:#3a2508}

/* ---- Leisten: Holzbänkchen ---- */
.rack{background:linear-gradient(180deg,var(--wood-a),var(--wood-c));border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,230,190,.35),inset 0 -3px 0 rgba(60,30,5,.35),0 3px 0 #6b4320,0 8px 16px rgba(60,30,5,.25)}
.slot{border:1.5px dashed rgba(255,230,190,.35)}

<body>
<div id="app">

  <section id="start" class="screen center">

  <!-- Online: Spiel erstellen / beitreten -->

    <div class="panel" id="eventBody"></div>

  <section id="dash" class="screen center scroll hidden">
    <div class="panel" id="dashBody"></div>

  <section id="mode" class="screen center scroll hidden">
    <div class="panel">
      <h2>Spiel leiten</h2>

<script>
'use strict';
/* ================= Helpers ================= */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(a,v,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const frame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
const clone=o=>JSON.parse(JSON.stringify(o));
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const secs=ms=>(ms/1000).toFixed(1).replace('.',',')+' s';

/* ================= Spielmaterial ================= */
const EMO={
  '🌧️':{name:'Es regnet',main:'Es regnet',sub:'es regnet',inv:'regnet es',nmain:'Es regnet nicht',nsub:'es nicht regnet',ninv:'regnet es nicht'},
  '☂️':{name:'Ich nehme den Schirm',main:'Ich nehme den Schirm',sub:'ich den Schirm nehme',inv:'nehme ich den Schirm',nmain:'Ich nehme den Schirm nicht',nsub:'ich den Schirm nicht nehme',ninv:'nehme ich den Schirm nicht'},
  '🍕':{name:'Es gibt Pizza',main:'Es gibt Pizza',sub:'es Pizza gibt',inv:'gibt es Pizza',nmain:'Es gibt keine Pizza',nsub:'es keine Pizza gibt',ninv:'gibt es keine Pizza'},
  '🐱':{name:'Die Katze schnurrt',main:'Die Katze schnurrt',sub:'die Katze schnurrt',inv:'schnurrt die Katze',nmain:'Die Katze schnurrt nicht',nsub:'die Katze nicht schnurrt',ninv:'schnurrt die Katze nicht'},
  '🎉':{name:'Wir feiern',main:'Wir feiern',sub:'wir feiern',inv:'feiern wir',nmain:'Wir feiern nicht',nsub:'wir nicht feiern',ninv:'feiern wir nicht'}
};
const EMOJIS=Object.keys(EMO);
const DEF={'→':['B',1],'∨':['B',3],'(':['O',2],')':['C',2],'¬':['N',2]};
EMOJIS.forEach(e=>DEF[e]=['L',1]);
const BAG_BASE={'→':22,'¬':12};EMOJIS.forEach(e=>BAG_BASE[e]=10);
const COLORS=['#0a66d8','#1f9d55','#8e44d6','#e0457b','#e08a00','#00a0a0'];
const TEAMS=[{name:'Füchse',icon:'🦊'},{name:'Bären',icon:'🐻'},{name:'Eulen',icon:'🦉'}];
const MAX_PLAYERS=6;
const MAX_NEW=4,DEFAULT_TURN_TIME=60,MAX_GROUP=4;
const GLITTER_BONUS=10,CHAIN_BONUS=5,TEAM_BONUS=15,MOVES_PER_TURN=2,FADE_ROUNDS=3;
const BLITZ_POINTS=[15,10,6,3];
// Tafeln mit Vorgaben. 'E' = Feld für ein Emoji, 'n' = kleines Feld für ein optionales ¬,
// alles andere ist fest vorgegeben (auch Emojis als Orientierung).
const KINDS={
  mini:{name:'Mini',bonus:3,gen:(A,B)=>({rows:[[A,'→','E'],['E']],concl:['E'],sol:[B,A,B]})},
  mp:{name:'Ponens',bonus:5,gen:(A,B,C,D,v)=>v?{rows:[['n',A,'→','n','E'],['n','E']],concl:['n','E'],sol:[B,A,B]}
                                              :{rows:[['n','E','→','n',B],['n','E']],concl:['n','E'],sol:[A,A,B]}},
  mt:{name:'Tollens',bonus:6,gen:(A,B,C,D,v)=>v?{rows:[[A,'→','E'],['¬','E']],concl:['¬','E'],sol:[B,B,A]}

  oder:{name:'Oder',bonus:10,gen:(A,B,C)=>({rows:[['(',A,'∨','E',')','→','E'],['E','∨','E']],concl:['E'],sol:[B,C,A,B,C]})},
  boss:{name:'Endgegner',bonus:25,minDepth:2,boss:true,gen:(A,B,C)=>({rows:[['n','E','→','n','E'],['n','E','→','n','E'],['n','E']],concl:[C],sol:[A,B,B,C,A]})},
  boss3:{name:'Großer Endgegner',bonus:40,minDepth:3,boss:true,gen:(A,B,C,D)=>({rows:[['n','E','→','n','E'],['n','E','→','n','E'],['n','E','→','n','E'],['n','E']],concl:[D],sol:[A,B,B,C,C,D,A]})}
};

const uidT=()=>Math.random().toString(36).slice(2,10);
const ORANGE_SHARE=.3,GLITTER_SHARE=.12;
function newTile(s){return{id:uidT(),s,orange:Math.random()<ORANGE_SHARE,glitter:Math.random()<GLITTER_SHARE,cashed:false};}
const fixedTile=s=>({tile:{id:uidT(),s,orange:false,glitter:false,cashed:true},by:null,fixed:true});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeBag(size=100){const b=[];for(const[s,n]of Object.entries(BAG_BASE))for(let i=0;i<Math.max(1,Math.round(n*size/100));i++)b.push(newTile(s));
  shuffle(b).forEach((t,i)=>t.orange=i%10<3);return shuffle(b);}
function fillRacksOf(players,bag,fresh){players.forEach(p=>p.rack.forEach((t,k)=>{if(!t&&bag.length){const n=bag.pop();p.rack[k]=n;fresh&&fresh.add(n.id);}}));}
const fillRacks=()=>fillRacksOf(S.players,S.bag,S.fresh);
function makeTafel(kind,band,pos,id,tpl,open=0){
  tpl=tpl||genTpl(kind);
  const free=t=>t==='E'||t==='n'||t==='J';
  const conv=toks=>toks.map(t=>t==='→'&&open&&Math.random()<open?'J':t);
  const row=toks=>{toks=conv(toks);return{types:toks.map(t=>free(t)?t:'F'),slots:toks.map(t=>free(t)?null:fixedTile(t)),t:0};};
  const concl=row(tpl.concl);if(KINDS[kind].boss)concl.locked=true;
  return{id,kind,band,pos,rows:tpl.rows.map(row),concl,solved:null};
}
// Brettgröße wächst mit der Spielerzahl: mindestens zwei Tafeln pro Person
function buildLevel(lvl,n=2){
  const LV=LEVELS[lvl-1],out=[];let k=0;
  LV.bands.forEach((band,bi)=>band.forEach((kind,pi)=>out.push(makeTafel(kind,bi,pi,'t'+(k++),null,LV.open))));
  const base=out.length,target=Math.max(base,2*n);
  for(let i=0;out.length<target;i++)out.push(makeTafel(LV.extra[i%LV.extra.length],50+i,0,'t'+(k++),null,LV.open));
  return out;
}
// Beutel nach Bedarf: gemischt nach den freien Feldern auf dem Brett
function makeBagFor(tafeln,lvl){
  const LV=LEVELS[lvl-1],base=LV.bands.flat().length,size=Math.round(LV.bag*Math.max(1,tafeln.length/base));
  let E=0,N=0,J=0;
  tafeln.forEach(tf=>[...tf.rows,tf.concl].forEach(r=>r.types.forEach((t,i)=>{if(r.slots[i])return;if(t==='E')E++;else if(t==='n')N++;else if(t==='J')J++;})));
  const w={};EMOJIS.forEach(e=>w[e]=E*1.6/EMOJIS.length);
  w['¬']=N*.3+E*.05+1;w['→']=J*1.4+.4;
  const tot=Object.values(w).reduce((a,b)=>a+b,0),b=[];
  Object.entries(w).forEach(([s,x])=>{const c=Math.round(size*x/tot);for(let i=0;i<c;i++)b.push(newTile(s));});
  shuffle(b).forEach((t,i)=>t.orange=i%10<3);return shuffle(b);
}

/* ================= Legeregeln ================= */
const R=n=>({rule:n,msg:RULES[n]});
function pairErr(a,b){
  if(NEXT[a].includes(b))return null;
  if(a==='L'&&b==='L')return R(1);
  if(a==='B'||b==='B')return R(2);
  if(b==='N'||a==='N')return R(3);
  return R(4);
}
function seqError(syms){for(let i=0;i+1<syms.length;i++){const e=pairErr(DEF[syms[i]][0],DEF[syms[i+1]][0]);if(e)return e;}return null;}
function insertError(tf,r,k,s,kind){
  const row=rowOf(tf,r);
  if(tf.solved)return{msg:'Diese Tafel ist schon gelöst.'};
  if(row.locked)return{msg:'Das ist das Ziel des Endgegners. Bau darüber die Prämissen, aus denen es folgt.'};
  if(r==='c'&&kind==='move')return{msg:'In die Konklusion kommen nur neue Steine aus der Leiste.'};
  if(row.slots[k])return{msg:'Dieses Feld ist schon belegt.'};
  const ty=row.types[k];
  if(ty==='E'&&DEF[s][0]!=='L')return{msg:'In dieses Feld gehört eine Aussage, also ein Emoji.'};
  if(ty==='J'&&DEF[s][0]!=='B')return{msg:'In dieses Feld gehört ein Pfeil → (wenn … dann).'};
  if(ty==='n'&&s!=='¬')return{msg:'Das kleine Feld ist nur für ein ¬ (nicht), falls du die Aussage daneben verneinen willst.'};
  // Nur direkt benachbarte Steine prüfen. Liegt dazwischen noch ein leeres Pflichtfeld
  // (Emoji oder Junktor), kommt dort später etwas hin – dann ist die Lücke kein Fehler.
  const syms=row.slots.map((e,i)=>i===k?s:(e?e.tile.s:null));
  let prev=-1;
  for(let i=0;i<syms.length;i++){
    if(!syms[i])continue;
    if(prev>=0){
      let gap=false;for(let j=prev+1;j<i;j++)if(row.types[j]==='E'||row.types[j]==='J')gap=true;
      if(!gap){const e=pairErr(DEF[syms[prev]][0],DEF[syms[i]][0]);if(e)return e;}
    }
    prev=i;
  }
  return null;
}
function canInsertSomewhere(tf,r,s,kind){
  const row=rowOf(tf,r);
  for(let k=0;k<row.slots.length;k++)if(!row.slots[k]&&!insertError(tf,r,k,s,kind))return true;
  return false;
}

/* ================= Logik ================= */
function parse(syms){
  let i=0;
  const unary=()=>{
    const s=syms[i];
    if(s===undefined)throw'Die Zeile endet mitten im Ausdruck.';
    const t=DEF[s][0];
    if(t==='N'){i++;return{op:'not',a:unary()};}
    if(t==='L'){i++;return{op:'atom',n:s};}
    if(t==='O'){i++;const f=formula();if(syms[i]!==')')throw'Eine Klammer wird nicht geschlossen.';i++;return f;}
    throw'An einer Stelle fehlt eine Aussage.';
  };
  const formula=()=>{
    const a=unary(),s=syms[i];
    if(s==='→'||s==='∨'){i++;const b=unary();if(syms[i]==='→'||syms[i]==='∨')throw'R5';return{op:s==='→'?'imp':'or',a,b};}
    return a;
  };
  const f=formula();
  if(i<syms.length){if(syms[i]==='→'||syms[i]==='∨')throw'R5';if(syms[i]===')')throw'Hier wird eine Klammer geschlossen, die nie geöffnet wurde.';throw'Die Zeile lässt sich so nicht lesen.';}
  return f;
}
const wrap=f=>(f.op==='imp'||f.op==='or')?'('+key(f)+')':key(f);
function key(f){switch(f.op){case'atom':return f.n;case'not':return'¬'+wrap(f.a);case'imp':return wrap(f.a)+'→'+wrap(f.b);case'or':return wrap(f.a)+'∨'+wrap(f.b);}}
const neg=f=>f.op==='not'?f.a:{op:'not',a:f};
function derive(prem,concl){
  const K=new Map();
  prem.forEach(p=>{const k=key(p);if(!K.has(k))K.set(k,{f:p,d:0,rule:null});});
  const add=(f,d,rule)=>{const k=key(f),e=K.get(k);if(!e||e.d>d){K.set(k,{f,d,rule});return true;}return false;};
  for(let it=0;it<14;it++){
    let ch=false;
    for(const{f,d}of[...K.values()])if(f.op==='imp'){
      const A=K.get(key(f.a));if(A)ch=add(f.b,Math.max(d,A.d)+1,'MP')||ch;
      const NB=K.get(key(neg(f.b)));if(NB)ch=add(neg(f.a),Math.max(d,NB.d)+1,'MT')||ch;
    }
    if(!ch)break;
  }
  const e=K.get(key(concl));
  return e&&e.d>0?e:null;
}
function lit(f){
  if(f.op==='atom')return{main:EMO[f.n].main,sub:EMO[f.n].sub,inv:EMO[f.n].inv};
  if(f.op==='not'&&f.a.op==='atom'){const m=EMO[f.a.n];return{main:m.nmain,sub:m.nsub,inv:m.ninv};}
  return null;
}
function premSentence(f){
  const l=lit(f);if(l)return l.main+'.';
  if(f.op==='imp'){const a=lit(f.a),b=lit(f.b);if(a&&b)return`Wenn ${a.sub}, dann ${b.inv}.`;
    if(f.a.op==='or'){const x=lit(f.a.a),y=lit(f.a.b);if(x&&y&&b)return`Wenn ${x.sub} oder ${y.sub}, dann ${b.inv}.`;}}
  if(f.op==='or'){const a=lit(f.a),b=lit(f.b);if(a&&b)return`${a.main} oder ${lc(b.main)}.`;}
  return null;
}
function storyFor(prem,cf){
  const parts=prem.map(premSentence),l=lit(cf);
  if(parts.some(p=>!p)||!l)return null;
  return parts.join(' ')+` Also ${l.inv}.`;
}
function evalTafel(tf,who){
  const fail=(msg,short='Folgt noch nicht')=>({ok:false,msg,short,tid:tf.id});
  const K=KINDS[tf.kind];
  // Alle Emoji- und Junktor-Felder müssen belegt sein (nur die kleinen ¬-Felder bleiben freiwillig)
  const open=[...tf.rows,tf.concl].reduce((n,r)=>n+r.types.filter((t,i)=>(t==='E'||t==='J')&&!r.slots[i]).length,0);
  if(open)return fail(`Auf dieser Tafel ${open===1?'ist noch ein Feld':'sind noch '+open+' Felder'} frei. Ein Schluss zählt erst, wenn alle großen Felder belegt sind.`,open===1?'1 Feld frei':open+' Felder frei');
  const premRows=tf.rows.filter(r=>entries(r).length);
  if(!premRows.length)return fail('Über der Linie fehlen noch Prämissen.','Prämissen fehlen');
  const cE=entries(tf.concl);
  if(!cE.length||cE.every(e=>e.fixed&&!tf.concl.locked))return fail('Leg die Konklusion in die blaue Zeile unter der Linie.','Konklusion fehlt');
  const prem=[];
  for(const row of premRows){
    try{prem.push(parse(entries(row).map(e=>e.tile.s)));}
    catch(e){return e==='R5'?fail(RULES[5],'Zu viele Pfeile'):fail(`Eine Prämisse ist noch nicht vollständig. ${e}`,'Zeile unvollständig');}
  }
  let cf;try{cf=parse(cE.map(e=>e.tile.s));}
  catch(e){return e==='R5'?fail(RULES[5],'Zu viele Pfeile'):fail(`Die Konklusion ist noch nicht vollständig. ${e}`,'Konklusion unvollständig');}
  const d=derive(prem,cf);
  if(!d)return fail('Das folgt weder per Modus Ponens noch per Modus Tollens aus den Zeilen darüber.');
  if(K.minDepth&&d.d<K.minDepth)return fail(`Diese Tafel verlangt eine Kette aus mindestens ${K.minDepth} Schritten.`,`Mind. ${K.minDepth} Schritte nötig`);
  const gains={};let glit=0;
  [...premRows,tf.concl].forEach(row=>entries(row).forEach(e=>{if(e.fixed||e.by==null)return;gains[e.by]=(gains[e.by]||0)+DEF[e.tile.s][1];if(e.tile.glitter&&!e.tile.cashed)glit++;}));
  const bonus=K.bonus+(d.d-1)*CHAIN_BONUS+glit*GLITTER_BONUS;
  gains[who]=(gains[who]||0)+bonus;
  const label=d.d>1?'Kettenschluss':(d.rule==='MP'?'Modus Ponens':'Modus Tollens');
  return{ok:true,tid:tf.id,gains,mine:gains[who],total:Object.values(gains).reduce((a,b)=>a+b,0),label,story:storyFor(prem,cf),depth:d.d};
}
const touched=tf=>[...tf.rows,tf.concl].some(r=>entries(r).some(e=>e.tent||e.moved));
function pendingResults(){
  const res=[];
  S.tafeln.forEach(tf=>{
    if(tf.solved||!touched(tf))return;
    if(tf.concl.locked){const ev=evalTafel(tf,S.cur);if(ev.ok)res.push(ev);}
    else if(entries(tf.concl).some(e=>!e.fixed))res.push(evalTafel(tf,S.cur));
  });
  return res;
}

const G={};
function slotW(row,i,c){
  const ty=row.types[i];

function computeGeometry(c,list,maxW){

  const order=[...list].sort((a,b)=>a.band-b.band||a.pos-b.pos);
  const lines=[];let line=null;
  order.forEach(tf=>{
    const sz=tafelSize(tf,c);
    if(!line||line.w+G.bgap+sz.w>maxW-2*G.edge){line={items:[],w:-G.bgap,h:0};lines.push(line);}
    line.items.push({tf,sz});line.w+=G.bgap+sz.w;line.h=Math.max(line.h,sz.h);
  });
  let y=G.edge,W=0;G.place={};
  lines.forEach(l=>{W=Math.max(W,l.w);});
  lines.forEach(l=>{
    let x=G.edge+(W-l.w)/2;
    l.items.forEach(({tf,sz})=>{G.place[tf.id]={x,y:y+(l.h-sz.h)/2,w:sz.w,h:sz.h};x+=sz.w+G.bgap;});

/* ================= Layout ================= */
function layout(){
  const app=$('#app'),W=app.clientWidth,H=app.clientHeight,root=document.documentElement.style;
  const topH=52+(S.tutorial?64:0),n=S.n||2;
  const tm=Math.round(clamp(16,(W-170)/9,W>700?30:(n>4?20:24)));
  const stripH=(n-1)*(tm+(n>4?10:16))+6+(teamMode()?34:0);
  const tA=Math.round(clamp(32,(W-40)/8.9,54));
  const dockH=tA+26+46+34;
  const avW=W-12,avH=H-topH-stripH-dockH-12;
  const list=boardTafeln();
  const cMax=S.tutorial?84:inBlitz()?66:58,cMin=Math.min(30,Math.floor(avW/9.5));
  let c=cMax;
  for(;c>cMin;c--){computeGeometry(c,list,avW);if(G.H<=avH&&G.W<=avW)break;}
  computeGeometry(c,list,avW);
  const h=Math.min(G.H,avH),free=Math.max(0,avH-h),top=topH+stripH+free/2+6;
  const bh=$('#boardHolder');
  Object.assign(bh.style,{left:(W-G.W)/2+'px',top:top+'px',width:G.W+'px',height:h+'px'});
  bh.classList.toggle('scroll',G.H>avH+1);
  Object.assign($('#turnRing').style,{left:((W-G.W)/2-5)+'px',top:(top-5)+'px',width:(G.W+10)+'px',height:(h+10)+'px'});
  $('#boardCard').style.height=G.H+'px';
  $('#strip').style.top=topH+'px';$('#dock').style.height=dockH+'px';
  $('#toasts').style.top=(top+10)+'px';
  root.setProperty('--tA',tA+'px');root.setProperty('--tm',tm+'px');root.setProperty('--cell',G.c+'px');
  root.setProperty('--pad',G.pad+'px');root.setProperty('--lgap',G.lgap+'px');root.setProperty('--badge',G.badge+'px');
  $('#orient').classList.toggle('show',S.screen==='game'&&W>H&&H<500);
  positionCoach();
}

function actSlotTap(tid,r,k){

  if(e){
    if(e.tent&&!S.sel){row.slots[k]=null;returnToRack(e.from,e.slot,e.tile);render();return;}
    if(tf.solved){if(tf.solved.story)toast(tf.solved.story,'','story',5000);return;}
    if(e.fixed){toast(row.locked?'Das ist das Ziel des Endgegners.':'Dieser Stein ist eine Vorgabe der Tafel.');return;}
    if(!e.tent){toast('Dieser Stein liegt fest. Nur Steine aus deinem aktuellen Zug kannst du zurücknehmen.');return;}
    return;
  }
  if(!S.sel){toast('Zieh einen Stein aus deiner Leiste auf ein Feld oder tippe ihn erst an.');return;}
  const src=S.sel,t=rackTile(src);
  const err=insertEntry({tile:t,from:src.p,slot:src.slot},tid,r,k,'new');
  if(err){shakeRow(tid,r);ruleToast(err);return;}
  rackOf(src.p)[src.slot]=null;S.popIds.add(t.id);S.sel=null;render();afterChange();
}
function actUndo(){
  if(inBlitz()){const b=S.blitz;b.tf=clone(b.tfStart);b.rack=clone(b.rackStart);S.sel=null;render();return;}
  if(!S.snap)return;
  S.tafeln=clone(S.snap.tafeln);S.players.forEach((p,i)=>p.rack=clone(S.snap.racks[i]));
  S.moves=0;S.sel=null;cancelMode();render();
}
function actExStart(n){
  if(S.exchanged){toast('Tauschen geht einmal pro Zug.');return;}
  if(hasNew()||S.moves){toast('Getauscht wird vor dem Legen. Nimm deine Steine mit ↺ zurück, wenn du tauschen willst.');return;}
  S.mode='exchange';S.exN=n;S.exSel=[];S.sel=null;render();
}
function actExGo(){
  const rack=curP().rack,out=S.exSel.map(k=>rack[k]);
  S.exSel.forEach(k=>{rack[k]=S.bag.pop();S.fresh.add(rack[k].id);});
  S.bag.push(...out);shuffle(S.bag);
  S.exchanged=true;cancelMode();S.rev++;takeSnap();render();writeGame();
  toast('Getauscht. Jetzt noch mindestens einen Stein legen.');
}
// Level vorbei? Dann Teamwork-Bonus und Blitzrunde vorbereiten
function finishLevelIfDue(lm){
  if(S.tutorial)return false;
  const full=S.tafeln.every(t=>t.solved);
  const empty=S.lastCall!=null&&S.lastCall<=0;
  if(!full&&!empty)return false;
  lm.levelDone=true;lm.team=full?TEAM_BONUS:0;
  if(full)S.players.forEach(p=>p.score+=TEAM_BONUS);
  if(S.level>=LEVELS.length){S.status='ended';return true;}
  S.status='blitz';S.blitzSpec=makeBlitzSpec(S.level);
  return true;
}
function tickLastCall(){
  if(S.bag.length===0&&S.lastCall==null)S.lastCall=S.n;
  else if(S.lastCall!=null)S.lastCall--;
}
async function actEndTurn(){
  if(S.mode!=='place')cancelMode();
  S.sel=null;
  if(!hasNew()){render();toast('Lege in jedem Zug mindestens einen neuen Stein aus deiner Leiste.');return;}
  const res=pendingResults(),bad=res.filter(r=>!r.ok);
  if(bad.length){
    bad.forEach(b=>{const tf=tafel(b.tid);if(tf.concl.locked)return;
      tf.concl.slots=tf.concl.slots.map(e=>{if(e&&e.tent){returnToRack(e.from,e.slot,e.tile);return null;}return e;});});
    render();scheduleDraft();
    toast(bad[0].msg+' Die Konklusion kommt zurück in deine Leiste.','Das ist noch kein gültiger Schluss','',6500);
    return;
  }
  S.busy=true;
  const mover=S.cur,placed=[];
  S.tafeln.forEach(tf=>[...tf.rows,tf.concl].forEach(row=>{
    let ch=false;
    row.slots.forEach(e=>{if(!e)return;if(e.tent){placed.push(e.tile.id);ch=true;}if(e.moved)ch=true;delete e.tent;delete e.from;delete e.slot;delete e.moved;});
    if(ch)row.t=S.turn;
  }));
  const solved=[];
  res.filter(r=>r.ok).forEach(ev=>{
    const tf=tafel(ev.tid);
    [...tf.rows,tf.concl].forEach(row=>entries(row).forEach(e=>{if(e.tile.glitter)e.tile.cashed=true;}));
    Object.entries(ev.gains).forEach(([i,p])=>S.players[i].score+=p);
    tf.solved={by:mover,label:ev.label,story:ev.story};
    solved.push({tid:ev.tid,gains:ev.gains,total:ev.total,label:ev.label,story:ev.story});
  });
  const faded=[];
  S.tafeln.forEach(tf=>{if(tf.solved)return;tf.rows.forEach((row,r)=>{
    const loose=entries(row).filter(e=>!e.fixed);
    if(!loose.length||S.turn-row.t<FADE_ROUNDS*S.n)return;
    S.bag.push(...loose.map(e=>e.tile));row.slots=row.slots.map(e=>e&&e.fixed?e:null);faded.push({tid:tf.id,r});
  });});
  if(faded.length)shuffle(S.bag);
  S.passes=0;fillRacks();tickLastCall();
  const lm={turn:S.turn+1,by:mover,placed,solved,faded};
  const levelOver=finishLevelIfDue(lm);
  if(!levelOver&&!S.tutorial){S.cur=(S.cur+1)%S.n;S.exchanged=false;}
  S.turn++;S.rev++;S.lastMove=lm;S.animTurn=S.turn;
  writeGame();
  await playMove(lm);
  takeSnap();S.busy=false;
  afterMove(lm);
}
async function passTurn(){
  closeModal();actUndo();
  const mover=S.cur;S.passes++;
  tickLastCall();
  const lm={turn:S.turn+1,by:mover,skipped:true,placed:[],solved:[],faded:[]};
  if(S.passes>=S.n*2&&S.lastCall==null)S.lastCall=0;  // alle hängen fest: Level beenden
  const levelOver=finishLevelIfDue(lm);
  if(!levelOver){S.cur=(S.cur+1)%S.n;S.exchanged=false;}
  S.turn++;S.rev++;S.lastMove=lm;S.animTurn=S.turn;
  writeGame();takeSnap();
  if(levelOver){S.busy=true;await playMove(lm);S.busy=false;}
  else render();
  afterMove(lm);
}
function afterMove(lm){
  if(S.status==='ended'){S.ended=true;return endGame();}
  if(S.status==='blitz'){enterBlitz();return;}
  render();turnNotice(lm);
}
function finishGame(){closeModal();S.status='ended';S.ended=true;S.rev++;writeGame();endGame();}

/* ================= Blitzrunde ================= */
function makeBlitzSpec(level){
  const B=BLITZ[(level-1)%BLITZ.length],tpl=genTpl(B.kind);
  const pick=()=>EMOJIS[Math.random()*EMOJIS.length|0];
  const extra=[pick(),['¬',pick()][Math.random()*2|0]];
  const rack=shuffle([...tpl.sol,...extra]).map(s=>({id:uidT(),s,orange:false,glitter:false,cashed:true}));
  return{level,kind:B.kind,sec:B.sec,rack,tpl:{rows:tpl.rows,concl:tpl.concl},id:uidT()};
}
function enterBlitz(){
  clearStory();
  const sp=S.blitzSpec;if(!sp)return;
  if(S.blitz&&S.blitz.id===sp.id)return;
  const tf=makeTafel(sp.kind,0,0,'blitz',sp.tpl);
  const order=S.online?[meIdx()].filter(i=>i>=0):S.players.map((_,i)=>i);
  S.blitz={id:sp.id,spec:sp,tf,tfStart:clone(tf),rack:clone(sp.rack),rackStart:clone(sp.rack),results:[],running:false,finished:order.length===0,
    order,idx:0,player:order[0],label:''};
  S.sel=null;cancelMode();
  if(!S.online)S.cur=order[0];
  layout();
  S.blitz.label=S.online?'Los!':`${S.players[order[0]].name}: Los!`;
  if(!S.tutorial&&!S.online)showModal(`<h3>Blitzrunde!</h3><p>Alle bekommen dieselben Steine und dieselbe Tafel. Wer zuerst einen gültigen Schluss legt, bekommt am meisten Punkte: ${BLITZ_POINTS.slice(0,S.n).map(p=>'+'+p).join(', ')}.</p>
    <p>Du hast ${sp.sec} Sekunden. ${S.online?'Alle spielen gleichzeitig auf ihrem Gerät.':'Ihr spielt nacheinander, das Gerät wird weitergereicht.'}</p>
    <div class="stack"><button class="btn primary" data-act="closeModal">Verstanden</button></div>`);
  render();
  if(S.online){
    onLiveDocs(S.liveDocs||[]);
    if(S.blitz.finished)toast('Du schaust bei dieser Blitzrunde zu.');
    else{blitzCountdown();botBlitz();}      // auf mehreren Geräten: alle starten automatisch gleichzeitig
  }
}
function botBlitz(){
  const bi=S.players.findIndex(p=>p.bot);if(bi<0||meIdx()<0)return;
  const b=S.blitz,id=b.id,sec=b.spec.sec,lvl=b.spec.level;
  const fail=Math.random()<.25,ms=fail?sec*1000:Math.round(sec*1000*(.45+Math.random()*.5));
  setTimeout(()=>{
    if(!S.blitz||S.blitz.id!==id)return;
    P.db.doc(`games/${S.code}/live/b_bot`).set({i:bi,ok:!fail,ms,level:lvl,id}).catch(()=>{});
  },4000+ms);
}
async function blitzCountdown(){
  const b=S.blitz;closeModal();
  const el=document.createElement('div');el.className='countdown';$('#fx').appendChild(el);
  for(const t of ['Blitzrunde!','3','2','1']){
    if(S.blitz!==b)break;
    el.textContent=t;el.classList.toggle('word',t.length>1);
    el.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:0},{transform:'translate(-50%,-50%) scale(1.1)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.75},{transform:'translate(-50%,-50%) scale(.9)',opacity:0}],{duration:900,easing:'ease-out',fill:'forwards'});
    await sleep(t.length>1?1300:900);
  }
  el.remove();
  if(S.blitz===b&&!b.running&&!b.finished)blitzGo();
}
function blitzGo(){
  const b=S.blitz;if(!b||b.running||b.finished)return;
  closeModal();
  b.tf=clone(b.tfStart);b.rack=clone(b.rackStart);
  b.running=true;b.start=performance.now();b.endAt=b.start+b.spec.sec*1000;
  render();
  clearInterval(b.timer);b.timer=setInterval(tickBlitz,200);
}
function tickBlitz(){
  const b=S.blitz;if(!b||!b.running)return;
  const left=Math.max(0,b.endAt-performance.now());
  const t=$('#blitzTime'),bar=$('#blitzBar');
  if(t)t.textContent=Math.ceil(left/1000)+' s';
  if(bar)bar.style.width=(left/(b.spec.sec*1000)*100)+'%';
  if(left<=0)blitzDone(false);
}
function checkBlitz(){
  const b=S.blitz;if(!b||!b.running)return;
  const ev=evalTafel(b.tf,b.player);
  if(ev.ok)blitzDone(true,ev);
}
async function blitzDone(ok,ev){
  const b=S.blitz;if(!b.running)return;
  b.running=false;clearInterval(b.timer);
  const ms=Math.round(performance.now()-b.start);
  const r={i:b.player,ok,ms,level:b.spec.level,id:b.id};
  if(ok){b.tf.solved={by:b.player,label:ev.label,story:ev.story};render();
    await polishTafel({tid:'blitz',label:ev.label,story:ev.story,total:secs(ms)}).catch(()=>{});}
  if(S.online){
    b.finished=true;b.mine=r;render();
    try{await P.db.doc(`games/${S.code}/live/b_${P.uid}`).set(clone(r));}catch(e){dbErr(e);}
    maybeFinalizeBlitz();
  }else if(S.tutorial){
    b.results.push(r);b.finished=true;render();
  }else{
    b.results.push(r);
    b.idx++;
    if(b.idx<b.order.length){
      b.player=b.order[b.idx];S.cur=b.player;b.label=`${S.players[b.player].name}: Los!`;
      b.tf=clone(b.tfStart);b.rack=clone(b.rackStart);render();
      toast(ok?`Geschafft in ${secs(ms)}! Jetzt ist ${S.players[b.player].name} dran.`:`Die Zeit ist um. Jetzt ist ${S.players[b.player].name} dran.`,'','turn',3000);
    }else{b.finished=true;render();finalizeBlitz(b.results);}
  }
}
// Online: Ergebnisse der anderen kommen über die live-Sammlung
function onLiveDocs(docs){
  S.liveDocs=docs;
  const b=S.blitz;if(!b)return;
  b.results=docs.filter(d=>d.id&&d.id===b.id&&d.level===b.spec.level&&d.i!=null).map(d=>({i:d.i,ok:d.ok,ms:d.ms}));
  if(S.screen==='game'&&!S.busy)renderRacks();
  maybeFinalizeBlitz();
}
let finalizeTimer=null;
function maybeFinalizeBlitz(){
  const b=S.blitz;if(!S.online||!b||!inBlitz())return;
  const all=S.players.every((_,i)=>b.results.some(r=>r.i===i));
  clearTimeout(finalizeTimer);
  if(all)finalizeTimer=setTimeout(()=>finalizeBlitz(b.results),600);
  else if(b.finished)finalizeTimer=setTimeout(()=>finalizeBlitz(b.results),(b.spec.sec+8)*1000);
}
function nextLevelDoc(d,results,joiners=[]){
  const lvl=d.level+1,ranked=results.filter(r=>r.ok).sort((a,b)=>a.ms-b.ms);
  const blitz=ranked.map((r,k)=>({i:r.i,ms:r.ms,pts:BLITZ_POINTS[k]||0}));
  blitz.forEach(x=>d.players[x.i].score+=x.pts);
  // Nachrücker aus Bot-Spielen kommen beim Levelwechsel dazu (höchstens MAX_GROUP Personen)
  joiners.forEach(j=>{
    if(d.players.length>=MAX_GROUP||d.players.some(p=>p.id===j.uid))return;
    d.players.push({id:j.uid,name:j.name,score:j.score||0,rack:Array(8).fill(null),color:COLORS[d.players.length%COLORS.length],team:null});
    d.playerIds=[...(d.playerIds||[]),j.uid];
  });
  d.tafeln=buildLevel(lvl,d.players.length);d.bag=makeBagFor(d.tafeln,lvl);
  d.players.forEach(p=>p.rack=Array(8).fill(null));fillRacksOf(d.players,d.bag);
  Object.assign(d,{level:lvl,status:'playing',cur:(lvl-1)%d.players.length,turn:d.turn+1,rev:d.rev+1,passes:0,exchanged:false,lastCall:null,blitzSpec:null,
    lastMove:{turn:d.turn+1,kind:'level',level:lvl,blitz,by:-1}});
  return d;
}
async function finalizeBlitz(results){
  const b=S.blitz;if(!b||b.finalizing)return;
  b.finalizing=true;
  const joiners=S.online?(L.liveAll||[]).filter(x=>x._id.startsWith('join_')).map(x=>({uid:x.uid,name:x.name,score:x.score})):[];
  const d=nextLevelDoc(serialize(),results,joiners);
  if(!S.online){deserialize(d);S.blitz=null;await levelIntro(d.lastMove,true);return;}
  const ref=P.db.doc('games/'+S.code);
  try{
    await P.db.runTransaction(async tx=>{
      const cur=await tx.get(ref);const c=cur.data();
      if(!c||c.status!=='blitz'||!c.blitzSpec||c.blitzSpec.id!==b.id)return;
      tx.set(ref,d);
    });
  }catch(e){b.finalizing=false;console.warn(e);}
}
async function levelIntro(lm,withDeal){
  clearStory();
  S.blitz=null;clearInterval(finalizeTimer);
  const lv=LEVELS[lm.level-1];
  const rows=(lm.blitz||[]).map((x,k)=>`<div><span>${k+1}.</span><span>${esc(S.players[x.i].name)}</span><span class="p">${secs(x.ms)}, +${x.pts}</span></div>`).join('');
  showModal(`<h3>Level ${lm.level}: ${esc(lv.name)}</h3>
    ${rows?`<p>Ergebnis der Blitzrunde:</p><div class="rank">${rows}</div>`:'<p>In der Blitzrunde hat diesmal niemand rechtzeitig geschlossen.</p>'}
    <p>Neues Brett, neue Steine. ${esc(curP().name)} beginnt.</p>
    <div class="stack"><button class="btn primary" data-act="closeModal">Los geht's</button></div>`);
  layout();
  if(withDeal)await deal();else render();
}

/* ================= Ziehen & Ablegen ================= */
function hitTest(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const sl=el.closest('.tslot');
  if(sl){const r=sl.dataset.r==='c'?'c':+sl.dataset.r;return{kind:'slot',tid:sl.dataset.tid,r,k:+sl.dataset.k};}
  if(el.closest('#boardCard'))return{kind:'board'};
  return null;
}
function startDrag(d){
  if(d.src.kind==='rack'){if(!canUse(d.src.p,d.src.slot))return false;S.sel=null;cancelMode();}
  else{
    const tf=tafel(d.src.tid),row=rowOf(tf,d.src.r),e=row.slots[d.src.k];
    if(!e||e.fixed||tf.solved)return false;
    if(!e.tent)return false;
    d.info={tile:e.tile,from:e.from,slot:e.slot};
    row.slots[d.src.k]=null;S.sel=null;
  }
  d.started=true;
  const size=d.src.kind==='rack'?Math.max(G.c,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tA'))):G.c;
  const w=document.createElement('div');w.innerHTML=tileHTML(d.info.tile,'dragclone');d.clone=w.firstChild;d.clone.style.setProperty('--s',size+'px');
  document.body.appendChild(d.clone);
  render();return true;
}
function moveClone(d,x,y){d.clone.style.transform=`translate(${x}px,${y}px) translate(-50%,-70%) rotate(-5deg) scale(1.08)`;}
function restoreMove(d){rowOf(tafel(d.src.tid),d.src.r).slots[d.src.k]={tile:d.info.tile,by:d.info.by};}
function finishDrag(d,x,y){
  const hit=x<0?null:hitTest(x,y);
  d.clone.remove();S.over=null;S.drag=null;
  const kind=d.src.kind==='move'?'move':'new';
  if(hit&&hit.kind==='slot'){
    if(kind==='move'&&hit.tid===d.src.tid&&hit.r===d.src.r&&hit.k===d.src.k){restoreMove(d);render();return;}
    const err=insertEntry(d.info,hit.tid,hit.r,hit.k,kind);
    if(!err){
      if(d.src.kind==='rack')rackOf(d.src.p)[d.src.slot]=null;
      if(kind==='move')S.moves++;
      S.popIds.add(d.info.tile.id);render();afterChange();return;
    }
    if(kind==='move')restoreMove(d);
    else if(d.src.kind==='board')returnToRack(d.info.from,d.info.slot,d.info.tile);
    render();shakeRow(hit.tid,hit.r);ruleToast(err);return;
  }
  if(kind==='move')restoreMove(d);
  else if(d.src.kind==='board')returnToRack(d.info.from,d.info.slot,d.info.tile);
  render();
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.seg-ctl button');
  if(b){b.classList.remove('press');void b.offsetWidth;b.classList.add('press');setTimeout(()=>b.classList.remove('press'),340);}
  S.suppressClick=false;
  if(!userOK()||S.mode==='exchange'||e.button>0)return;
  const rt=e.target.closest('.tile[data-p]');
  if(rt){const p=rt.dataset.p==='b'?'b':+rt.dataset.p,src={kind:'rack',p,slot:+rt.dataset.slot},t=rackTile(src);
    if(t)S.drag={src,info:{tile:t,from:p,slot:src.slot},x0:e.clientX,y0:e.clientY,started:false};return;}
  const bt=e.target.closest('.tile[data-tid]');
  if(bt){const r=bt.dataset.r==='c'?'c':+bt.dataset.r;
    S.drag={src:{kind:'board',tid:bt.dataset.tid,r,k:+bt.dataset.k},info:null,x0:e.clientX,y0:e.clientY,started:false};}
});
document.addEventListener('pointermove',e=>{
  const d=S.drag;if(!d)return;
  if(!d.started){if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<8)return;if(!startDrag(d)){S.drag=null;return;}}
  e.preventDefault();
  moveClone(d,e.clientX,e.clientY);
  const h=hitTest(e.clientX,e.clientY);
  const k=h&&h.kind==='slot'?`${h.tid}:${h.r}:${h.k}`:'';
  if(k!==d.lastKey){
    d.lastKey=k;
    if(h&&h.kind==='slot'){const tf=tafel(h.tid);h.err=insertError(tf,h.r,h.k,d.info.tile.s,d.src.kind==='move'?'move':'new');S.over=rowOf(tf,h.r).slots[h.k]?null:h;}
    else S.over=null;
    renderBoard();
  }
},{passive:false});
document.addEventListener('pointerup',e=>{
  const d=S.drag;if(!d)return;
  if(d.started){S.suppressClick=true;finishDrag(d,e.clientX,e.clientY);scheduleDraft();}else S.drag=null;
});
document.addEventListener('pointercancel',()=>{const d=S.drag;if(!d)return;if(d.started)finishDrag(d,-1,-1);S.drag=null;});

async function startLocalGame(names,turnTime=DEFAULT_TURN_TIME){

function endGame(){
  S.ended=true;S.busy=false;cancelMode();render();
  const order=S.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score);
  const top=order[0],tie=order.filter(p=>p.score===top.score).length>1;
  const won=S.level>=LEVELS.length&&S.tafeln.every(t=>t.solved);
  if(teamMode()){
    const tt=teamTotals(),tie2=tt.length>1&&tt[0].score===tt[1].score,T0=TEAMS[tt[0].team];

// Der Bot läuft auf dem Gerät der einzigen Person im Spiel. Er ist bewusst etwas schwächer.
const Bt={key:null,at:0,running:false};
function botHere(){return S.screen==='game'&&S.online&&!S.tutorial&&!S.ended&&S.status==='playing'&&!S.busy&&!!S.players&&curP().bot&&meIdx()>=0;}
function botSolve(tf,free,rack){
  const used=new Set(),chosen=[];
  const rec=i=>{
    if(i===free.length)return evalTafel(tf,S.cur).ok;
    const f=free[i];
    for(let j=0;j<rack.length;j++){
      const t=rack[j];if(!t||used.has(j))continue;
      if(!(f.ty==='E'?DEF[t.s][0]==='L':t.s==='→'))continue;
      rowOf(tf,f.r).slots[f.k]={tile:t,by:S.cur,tent:true,from:S.cur,slot:j};used.add(j);chosen[i]={ri:j,k:f.k,r:f.r};
      if(rec(i+1))return true;
      rowOf(tf,f.r).slots[f.k]=null;used.delete(j);
    }
    return false;
  };
  const ok=rec(0);
  if(ok)free.forEach(f=>{rowOf(tf,f.r).slots[f.k]=null;});
  return ok?chosen.map(c=>({...c})):null;
}
function botFindMove(bi){
  const rack=S.players[bi].rack,cands=[];
  for(const tf of S.tafeln){
    if(tf.solved||tf.concl.locked)continue;
    const free=[];
    [...tf.rows,tf.concl].forEach((row,ri)=>row.types.forEach((ty,k)=>{
      if((ty==='E'||ty==='J')&&!row.slots[k])free.push({r:ri===tf.rows.length?'c':ri,k,ty});}));
    if(!free.length||free.length>MAX_NEW)continue;
    const plan=botSolve(tf,free,rack);
    if(plan)cands.push({tid:tf.id,plan,n:free.length});
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>a.n-b.n);
  if(Math.random()<.25&&cands.length>1)cands.shift();   // übersieht manchmal die leichteste Tafel
  if(Math.random()<.12)return null;                      // oder zögert
  return cands[0].plan.map(p=>({...p,tid:cands[0].tid}));
}
function botExchange(bi){
  const rack=S.players[bi].rack,idx=shuffle(rack.map((t,i)=>t?i:-1).filter(i=>i>=0)).slice(0,3);
  const out=idx.map(i=>rack[i]);
  idx.forEach(i=>{rack[i]=S.bag.pop();});
  S.bag.push(...out);shuffle(S.bag);
  S.exchanged=true;S.rev++;takeSnap();render();writeGame();
  toast(`${S.players[bi].name} tauscht 3 Steine.`);
}
async function botTurn(){
  const bi=S.cur,rack=S.players[bi].rack;
  let mv=botFindMove(bi);
  if(!mv&&!S.exchanged&&S.bag.length>=3){botExchange(bi);await sleep(1500);mv=botFindMove(bi);}
  if(!mv){await passTurn();return;}
  for(const m of mv){
    const e=insertEntry({tile:rack[m.ri],from:bi,slot:m.ri},m.tid,m.r,m.k,'new');
    if(e){actUndo();await passTurn();return;}
    S.popIds.add(rack[m.ri].id);rack[m.ri]=null;render();await sleep(600);
  }
  await sleep(500);
  await actEndTurn();
}

async function onGameSnap(snap){

  }
}

// Liest firebase-config.js. Es darf der komplette Codeblock aus Firebase drinstehen.
async function loadConfig(){
  if(location.protocol==='file:')return{err:'file'};
  let t;
  try{const r=await fetch('firebase-config.js',{cache:'no-store'});if(!r.ok)return{err:'missing'};t=await r.text();}
  catch(e){return{err:'missing'};}
  const m=t.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})/);
  if(!m)return{err:'format'};
  try{
    const cfg=Function('"use strict";return ('+m[1]+');')();
    if(!cfg.apiKey||/HIER/i.test(cfg.apiKey)||!cfg.projectId)return{err:'config'};
    return{cfg};
  }catch(e){return{err:'format'};}
}
async function initPlatform(){
  const{cfg,err}=await loadConfig();
  if(err){P.reason=err;}
  else if(!window.firebase){P.reason='sdk';}
  else{
    try{
      if(!firebase.apps.length)firebase.initializeApp(cfg);
      const cred=await firebase.auth().signInAnonymously();
      P.uid=cred.user.uid;P.db=firebase.firestore();
      await P.db.collection('games').limit(1).get();   // prüft Datenbank und Regeln
      P.online=true;
    }catch(e){
      console.error(e);const c=(e&&e.code)||'';
      P.reason=/operation-not-allowed|configuration-not-found|admin-restricted/.test(c)?'anon'
        :/permission-denied/.test(c)?'rules'
        :/not-found|failed-precondition/.test(c)?'nodb'
        :/api-key|invalid-api-key/.test(c)?'format'
        :'net';
    }
  }
  if(P.online)await checkHost();
  P.ready=true;
  renderStart();
  if(S.screen==='mode')renderMode();
  if(S.screen==='play'){renderPlay();subscribeLists();}
  // Einladungslink (QR-Code): direkt in den Beitritt, nur noch nach dem Namen fragen
  if(L.eventInvite&&!S.inviteAsked){S.inviteAsked=true;
    if(P.online)startJoin(L.eventInvite);else{showScreen('play');renderPlay();}}
}

async function hostStart(){
  const g=L.lobby;let joins=L.joins.slice(0,MAX_PLAYERS).map(j=>({...j}));if(joins.length<2)return;
  if(g.teamsOn){
    // Leute ohne Team kommen ins kleinste Team, dann abwechselnd nach Teams sortieren
    const size=t=>joins.filter(j=>j.team===t).length;
    joins.filter(j=>j.team==null).forEach(j=>{const used=[0,1,2].sort((a,b)=>size(a)-size(b));j.team=used[0];});
    const groups=[0,1,2].map(t=>joins.filter(j=>j.team===t)).filter(x=>x.length);
    if(groups.length<2){toast('Für den Gruppenmodus braucht es mindestens zwei Teams.');return;}
    const order=[];for(let r=0;order.length<joins.length;r++)groups.forEach(gr=>{if(gr[r])order.push(gr[r]);});
    joins=order;
  }
  initState(joins.map(j=>j.name),joins.map(j=>j.id),true,joins.map(j=>g.teamsOn?j.team:null),g.turnTime??DEFAULT_TURN_TIME);
  Object.assign(S,{code:g.code,hostId:g.hostId,hostName:g.hostName,createdAt:g.createdAt});

/* ---------- QR-Code zum Beitreten ---------- */
function inviteUrl(kind,code){return location.origin+location.pathname+'?'+kind+'='+encodeURIComponent(code);}
function qrSVG(text){
  if(typeof qrcode!=='function')return null;
  const q=qrcode(0,'M');q.addData(text);q.make();
  const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
  return`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Beitreten"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#2d2016"/></svg>`;
}
function qrBlock(kind,code){
  const svg=qrSVG(inviteUrl(kind,code));
  if(!svg)return'';
  return`<button class="qr" data-act="qrBig" data-kind="${kind}" data-code="${esc(code)}" title="Groß anzeigen">${svg}<span>Mit der Handykamera scannen, um beizutreten. Antippen für Vollbild.</span></button>`;
}
function showQrBig(kind,code){
  const svg=qrSVG(inviteUrl(kind,code));if(!svg)return;
  showModal(`<div class="qrbig">${svg}<div class="code">${esc(code)}</div><p>Scannen oder unter „Starten“ den Code eingeben.</p></div><div class="stack"><button class="btn primary" data-act="closeModal">Schließen</button></div>`);

function warmSeats(ev){
  const now=Date.now(),out=[];
  Object.entries(ev.away||{}).forEach(([uid,a])=>{
    if(now-a.since>WARM_MS)return;
    const g=(ev.groups||[]).find(g=>g.gameCode===a.gc);if(!g||g.bot||g.merged)return;
    out.push({uid,gc:a.gc,group:g.name,name:a.name,since:a.since});
  });
  return out.sort((x,y)=>(y.uid===P.uid)-(x.uid===P.uid)||x.since-y.since);
}
