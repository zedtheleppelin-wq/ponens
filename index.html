/* ---------- Gruppen bilden (läuft auf dem Gerät der Spielleitung) ---------- */
// createGroupGame verändert den globalen Spielzustand kurz. Darum: sichern und danach wiederherstellen,
// damit die Spielleitung beim Zuschauen nichts davon merkt.
async function withScratchState(fn){
  const saved={...S};
  try{return await fn();}
  finally{Object.keys(S).forEach(k=>{if(!(k in saved))delete S[k];});Object.assign(S,saved);}
}
async function createGroupGame(ev,g){
  const gcode=makeCode(),withBot=g.members.length===1;
  const names=g.members.map(personName),ids=[...g.members];
  if(withBot){names.push('🤖 Bot');ids.push('bot-'+gcode);}
  await withScratchState(async()=>{
    initState(names,ids,true,[],ev.turnTime??DEFAULT_TURN_TIME);
    if(withBot)S.players[S.players.length-1].bot=true;
    Object.assign(S,{code:gcode,hostId:P.uid,hostName:ev.adminName,createdAt:Date.now(),eventCode:ev.code,groupName:g.name,status:'intro'});
    fillRacks();S.fresh.clear();
    await P.db.doc('games/'+gcode).set(serialize());
  });
  g.gameCode=gcode;g.startedAt=Date.now();g.bot=withBot;
}
async function autoGroups(){
  if(!isEvAdmin()||!E.ev||E.ev.status==='ended')return;
  if(E.working){E.again=true;return;}
  E.working=true;
  try{
    const ev=clone(E.ev),now=Date.now(),present=new Set(E.people.filter(p=>now-(p.hb||p.at||0)<AWAY_MS).map(p=>p.id));let ch=false,toSkip=[];
    ev.seq=ev.seq||0;
    // 1) Wer sich abgemeldet hat, verlässt seine wartende Gruppe
    ev.groups.forEach(g=>{if(!g.gameCode){const n=g.members.filter(id=>present.has(id));if(n.length!==g.members.length){g.members=n;ch=true;}}});
    const before=ev.groups.length;ev.groups=ev.groups.filter(g=>g.gameCode||g.members.length);if(ev.groups.length!==before)ch=true;
    // 2) Neue Leute in die erste wartende Gruppe mit freiem Platz setzen, sonst eine neue Gruppe aufmachen
    if(ev.status==='lobby'){
      const assigned=new Set(ev.groups.flatMap(g=>g.members));
      E.people.forEach(p=>{
        if(assigned.has(p.id)||!present.has(p.id))return;
        let g=ev.groups.find(g=>!g.gameCode&&g.members.length<GROUP_SIZE);
        if(!g){ev.seq++;g={id:'g'+ev.seq,name:'Gruppe '+ev.seq,members:[]};ev.groups.push(g);}
        g.members.push(p.id);ch=true;
      });
    }
    // 3) Frist neu setzen, wenn sich die Gruppe ändert. Voll oder abgelaufen: starten
    for(const g of ev.groups){
      if(g.gameCode)continue;
      if(g.n!==g.members.length){g.n=g.members.length;g.deadline=now+GROUP_WAIT_MS;ch=true;}
      if(g.members.length>=GROUP_SIZE||ev.status==='closed'||now>=g.deadline){await createGroupGame(ev,g);ch=true;}
    }
    // 4) Alleinspieler in Gruppen mit freiem Platz schicken (Wechsel beim nächsten Levelwechsel)
    const merges=clone(ev.merges||{});
    for(const [uid,m] of Object.entries(merges)){
      const d2=E.games[m.to];
      if(d2&&d2.players.some(p=>p.id===uid)){
        delete merges[uid];ch=true;
        const g1=ev.groups.find(g=>g.gameCode===m.from);if(g1){g1.merged=true;g1.mergedTo=(ev.groups.find(g=>g.gameCode===m.to)||{}).name||'';}
      }
    }
    const taken=new Set(Object.values(merges).map(m=>m.to));
    for(const s of ev.groups.filter(g=>g.bot&&g.gameCode&&!g.merged&&!merges[g.members[0]])){
      const d1=E.games[s.gameCode];if(!d1||d1.status==='ended')continue;
      const targets=ev.groups.filter(g=>!g.bot&&g.gameCode&&!g.merged).map(g=>({g,d:E.games[g.gameCode]}))
        .filter(x=>x.d&&x.d.status!=='ended'&&(x.d.level||1)<LEVELS.length)
        .map(x=>({...x,load:x.d.players.length+Object.values(merges).filter(m=>m.to===x.g.gameCode).length}))
        .filter(x=>x.load<MAX_GROUP).sort((a,b)=>a.load-b.load);
      if(!targets.length)break;
      merges[s.members[0]]={to:targets[0].g.gameCode,from:s.gameCode};ch=true;
    }
    // 5) Anwesenheit: Wer lange nichts von sich hören lässt, gilt als weg. Sein Platz bleibt warm.
    const away=clone(ev.away||{});
    for(const g of ev.groups){
      if(!g.gameCode||g.bot||g.merged)continue;
      const d=E.games[g.gameCode];if(!d)continue;
      if(d.status!=='ended'){      // Platz wurde übernommen: Mitgliederliste angleichen
        const ids=d.players.filter(p=>!p.bot).map(p=>p.id);
        const gone=g.members.filter(id=>!ids.includes(id)),added=ids.filter(id=>!g.members.includes(id));
        if(gone.length&&gone.length===added.length){g.members=g.members.map(id=>gone.includes(id)?added[gone.indexOf(id)]:id);ch=true;}
      }
      for(const p of d.players){
        if(p.bot)continue;
        const pe=E.people.find(x=>x.id===p.id),last=pe?(pe.hb||pe.at||0):0;
        const gone=d.status!=='ended'&&now-last>AWAY_MS;
        if(gone&&!away[p.id])away[p.id]={since:now,gc:g.gameCode,name:p.name};
        if(!gone&&away[p.id]&&away[p.id].gc===g.gameCode)delete away[p.id];
      }
    }
    for(const [uid,a] of Object.entries(away)){const d=E.games[a.gc];if(!d||d.status==='ended'||!d.players.some(p=>p.id===uid))delete away[uid];}
    if(JSON.stringify(away)!==JSON.stringify(ev.away||{})){ev.away=away;ch=true;}
    // 6) Ist, wer am Zug ist, weg (und nicht die ganze Gruppe), wird sein Zug übersprungen. Die anderen spielen weiter.
    for(const g of ev.groups){
      if(!g.gameCode||g.bot||g.merged)continue;
      const d=E.games[g.gameCode];if(!d||d.status!=='playing')continue;
      const cp=d.players[d.cur];if(!cp||cp.bot||!away[cp.id])continue;
      if(d.players.filter(p=>!p.bot).every(p=>away[p.id]))continue;
      const key=g.gameCode+':'+d.turn;if(E.skipped.has(key))continue;
      E.skipped.add(key);toSkip.push(g.gameCode);
    }
    if(ch)await writeEvent({groups:ev.groups,seq:ev.seq,merges,away:ev.away||{}});
    for(const gc of toSkip)await adminSkip(gc,true);
  }finally{E.working=false;if(E.again){E.again=false;autoGroups();}}
}
async function startGroupNow(gid){
  const ev=clone(E.ev),g=ev.groups.find(x=>x.id===gid);
  if(!g||g.gameCode||!g.members.length)return;
  try{await createGroupGame(ev,g);await writeEvent({groups:ev.groups});}catch(e){dbErr(e);}
}
/* ---------- Teilnehmende: Nachrücken aus dem Bot-Spiel ---------- */
function writeJoin(){
  if(!S.mergeTo||!P.online||!S.players)return;
  const i=meIdx();if(i<0)return;
  P.db.doc(`games/${S.mergeTo}/live/join_${P.uid}`).set({uid:P.uid,name:S.players[i].name,score:S.players[i].score,at:Date.now()}).catch(()=>{});
}
function watchMerge(to){
  writeJoin();
  gameSubs.push(P.db.doc('games/'+to).onSnapshot(s=>{
    if(!s.exists||S.mergeTo!==to)return;
    const d=s.data();if(d.players&&d.players.some(p=>p.id===P.uid))doMerge(d);
  },snapErr));
}
async function doMerge(d){
  if(S.merging)return;S.merging=true;
  unsub(gameSubs);
  while(S.busy)await sleep(300);
  try{await P.db.doc('games/'+S.code).set({...serialize(),status:'ended',rev:(S.rev||0)+1,updatedAt:Date.now()});}catch(e){}
  S.mergeTo=null;closeModal();clearStory();
  if(S.blitz)clearInterval(S.blitz.timer);S.blitz=null;S.tutorial=false;S.introCode=null;
  S.rev=0;S.animTurn=-1;
  subscribeGame(d.code);S.merging=false;
  toast(`Du spielst jetzt in ${d.groupName||'einer Gruppe'} mit.`,'','turn',3500);
}
/* ---------- Teilnehmende: Warteraum ---------- */
const leftText=ms=>Math.max(0,Math.ceil(ms/1000))+' s';
function renderEvent(){
  const b=$('#eventBody'),ev=E.ev;
  if(!ev){b.innerHTML='<p class="empty" style="text-align:center">Verbinde…</p>';return;}
  const g=ev.groups.find(g=>g.members.includes(P.uid));
  let t;
  if(!g)t=`<p class="waiting" style="text-align:center">Du wirst gleich einer Gruppe zugeteilt<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>`;
  else if(g.gameCode)t='<p class="waiting" style="text-align:center">Deine Gruppe startet<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>';
  else{
    const n=g.members.length,seats=Array.from({length:GROUP_SIZE},(_,i)=>g.members[i]?`<div class="seat full">${esc(personName(g.members[i]))}${g.members[i]===P.uid?' <span class="you">(du)</span>':''}</div>`:'<div class="seat">wartet …</div>').join('');
    const dl=`<b data-dl="${g.deadline||0}">${leftText((g.deadline||0)-Date.now())}</b>`;
    const msg=n===1?`Kommt niemand dazu, spielst du in ${dl} gegen einen 🤖 Bot. Später wechselst du in eine Gruppe.`
      :`Es geht los, sobald ${GROUP_SIZE} da sind, spätestens in ${dl}.`;
    t=`<div class="seats">${seats}</div><p class="waitmsg">${msg}</p>`;
  }
  b.innerHTML=`<h2>Warte auf Spieler</h2>${t}<div class="center-btns"><button class="linkbtn" data-act="leaveEvent">Abmelden</button></div>`;
}
async function leaveEvent(){
  try{await P.db.doc(`events/${E.code}/people/${P.uid}`).delete();}catch(e){}
  ACT.home();
}
async function closeEvent(){
  if(!confirm('Spiel wirklich auflösen? Laufende Gruppen werden beendet.'))return;
  await endEvent(true);
  try{await P.db.doc('events/'+E.code).delete();}catch(e){dbErr(e);}
  ACT.home();
}
async function shareEvent(){
  const url=inviteUrl('event',E.code);
  try{
    if(navigator.share){await navigator.share({title:'Ponens',text:'Mach mit bei Ponens! ',url});return;}
    await navigator.clipboard.writeText(url);toast('Link kopiert.');
  }catch(e){if(e&&e.name==='AbortError')return;prompt('Diesen Link verschicken:',url);}
}
/* ---------- Übersicht der Spielleitung ---------- */
function openDash(){showScreen('dash');renderDash();}
function groupInfo(g){
  const ev=E.ev,d=g.gameCode&&E.games[g.gameCode];
  if(g.merged)return{chip:'Gewechselt',cls:'over',meta:`${personName(g.members[0])} spielt jetzt in ${g.mergedTo||'einer Gruppe'}`,players:[]};
  if(!g.gameCode){
    const n=g.members.length;
    return{chip:'Wartet',cls:'wait',
      meta:n===1?`Allein, Bot-Spiel startet in <b data-dl="${g.deadline||0}">${leftText((g.deadline||0)-Date.now())}</b>`:`${n} von ${GROUP_SIZE}, Start in <b data-dl="${g.deadline||0}">${leftText((g.deadline||0)-Date.now())}</b>`,
      players:g.members.map(id=>({name:personName(id),score:null})).concat(Array.from({length:GROUP_SIZE-n},()=>({name:'frei',empty:true,score:null})))};
  }
  if(!d)return{chip:'Lädt …',cls:'',meta:'',players:[]};
  const solved=(d.tafeln||[]).filter(t=>t.solved).length,total=(d.tafeln||[]).length;
  const players=d.players.map((p,i)=>({name:p.name,bot:p.bot,score:p.score,turn:d.status==='playing'&&i===d.cur,away:!!(ev.away||{})[p.id],
    merging:(ev.merges||{})[p.id]&&((E.games[(ev.merges[p.id]||{}).to]||{}).groupName||'')}));
  if(d.status==='ended')return{chip:'Fertig',cls:'over',meta:`Endstand nach Level ${d.level}`,players,d};
  if(d.status==='intro')return{chip:'Tutorial',cls:'intro',meta:'Die Gruppe schaut das Tutorial',players,d};
  if(d.status==='blitz')return{chip:'Blitzrunde',cls:'blitz',meta:`Level ${d.level} von ${LEVELS.length} geschafft`,players,d,solved,total};
  return{chip:`Level ${d.level}/${LEVELS.length}`,cls:'',meta:`${solved} von ${total} Tafeln gelöst${g.bot?' · gegen Bot':''}`,players,d,solved,total};
}
function renderDash(){
  const b=$('#dashBody'),ev=E.ev;if(!ev){b.innerHTML='';return;}
  const open=ev.status==='lobby',all=[];
  let running=0,waiting=0,done=0;
  const cards=ev.groups.map(g=>{
    const info=groupInfo(g),d=info.d;
    if(g.merged){done++;return`<div class="gcard over slim"><div class="gh"><b>${esc(g.name)}</b><span class="gst">${info.chip}</span></div><small class="empty">${esc(info.meta)}</small></div>`;}
    if(!g.gameCode)waiting++;else if(d&&d.status==='ended')done++;else running++;
    if(d)d.players.forEach(p=>{if(!p.bot)all.push({name:p.name,score:p.score,group:g.name});});
    let btns='';
    if(!g.gameCode)btns=`<button class="btn" data-act="startGroup" data-gid="${esc(g.id)}">Jetzt starten</button>`;
    else if(d&&d.status!=='ended')btns=`<button class="btn primary" data-act="watchGroup" data-code="${esc(g.gameCode)}">Zuschauen</button>
      ${d.status==='playing'?`<button class="btn" data-act="skipGroup" data-code="${esc(g.gameCode)}">Zug überspringen</button>`:''}
      <button class="btn" data-act="endGroup" data-code="${esc(g.gameCode)}">Beenden</button>`;
    else if(d)btns=`<button class="btn" data-act="watchGroup" data-code="${esc(g.gameCode)}">Ansehen</button>`;
    const prog=info.total?`<div class="gprog"><i style="width:${info.solved/info.total*100}%"></i></div>`:'';
    const pl=info.players.map(p=>`<div class="${p.empty?'emptyseat':''}${p.turn?' on':''}"><span class="turn">${p.turn?'▶':''}</span><span>${p.bot?'🤖 ':''}${esc(p.name)}${p.away?' 💤 <small>Platz frei</small>':''}${p.merging!==undefined&&p.merging!==false&&p.merging!==''?` <small>→ ${esc(p.merging)}</small>`:''}</span>${p.score!=null?`<b>${p.score}</b>`:''}</div>`).join('');
    return`<div class="gcard ${info.cls}">
      <div class="gh"><b>${esc(g.name)}</b><span class="gst">${esc(info.chip)}</span></div>
      <div class="gmeta">${info.meta}</div>${prog}
      <div class="gpl">${pl}</div>
      ${d&&d.status==='playing'?`<div class="gturn">Dran: <b>${esc(d.players[d.cur].name)}</b></div>`:''}
      <div class="row-btns">${btns}</div></div>`;
  }).join('');
  all.sort((a,b)=>b.score-a.score);
  b.innerHTML=`<h2>Spielleitung</h2>
    <div class="code">${esc(ev.code)}</div>
    ${open?qrBlock('event',ev.code)+`<button class="btn" data-act="shareEvent" style="align-self:center">Einladungslink teilen</button>
      ${timeSel(ev.turnTime??DEFAULT_TURN_TIME,'eventTime')}
      <p class="hintline">Wer beitritt, kommt automatisch in eine Gruppe. Zu dritt geht es sofort los, sonst nach ${Math.round(GROUP_WAIT_MS/1000)} Sekunden zu zweit oder gegen einen Bot. Lass diese Seite dafür geöffnet.</p>`
      :'<p class="hintline">Die Anmeldung ist geschlossen.</p>'}
    <div class="sumrow"><span class="sumchip">${E.people.length} Personen</span><span class="sumchip">${running} spielen</span><span class="sumchip">${waiting} warten</span><span class="sumchip">${done} fertig</span></div>
    <div class="list"><h3>Gruppen</h3>
      ${ev.groups.length?`<div class="gcards">${cards}</div>`:'<p class="empty">Noch niemand da. Zeig den QR-Code oder teile den Link.</p>'}</div>
    ${all.length?`<div class="list"><h3>Gesamtrangliste</h3><div class="rank">${all.slice(0,30).map((p,k)=>`<div><span>${k+1}.</span><span>${esc(p.name)}<small>${esc(p.group)}</small></span><span class="p">${p.score}</span></div>`).join('')}</div></div>`:''}
    <div class="center-btns">
      ${open?'<button class="btn" data-act="closeSignup">Anmeldung schließen</button>':''}
      ${ev.status!=='ended'?'<button class="btn" data-act="endEvent">Alle Spiele beenden</button>':''}
      <button class="linkbtn" data-act="closeEvent">Spiel auflösen</button>
      <button class="linkbtn" data-act="home">Zum Hauptmenü</button></div>`;
}
async function adminSkip(gc,quiet){
  const d=clone(E.games[gc]);if(!d||d.status!=='playing')return;
  const mover=d.cur;d.passes=(d.passes||0)+1;d.cur=(d.cur+1)%d.players.length;d.turn++;d.rev++;d.exchanged=false;d.updatedAt=Date.now();
  d.lastMove={turn:d.turn,by:mover,skipped:true,placed:[],solved:[],faded:[]};
  try{await P.db.doc('games/'+gc).set(d);if(!quiet)toast(`Der Zug von ${d.players[mover].name} wurde übersprungen.`);}catch(e){dbErr(e);}
}
async function adminEndGame(gc,quiet){
  const d=E.games[gc];if(!d||d.status==='ended')return;
  if(!quiet&&!confirm('Das Spiel dieser Gruppe beenden?'))return;
  try{await P.db.doc('games/'+gc).set({...clone(d),status:'ended',rev:(d.rev||0)+1,updatedAt:Date.now()});}catch(e){dbErr(e);}
}
async function endEvent(quiet){
  if(!quiet&&!confirm('Alle Spiele beenden? Jede Gruppe bekommt ihre Endwertung.'))return;
  for(const g of E.ev.groups)if(g.gameCode)await adminEndGame(g.gameCode,true);
  await writeEvent({status:'ended'});
}
// Sekundentakt: Fristen prüfen (nur Spielleitung) und Countdowns in der Anzeige aktualisieren
setInterval(()=>{
  if(isEvAdmin()&&E.ev&&E.ev.status!=='ended')autoGroups();
  $$('[data-dl]').forEach(el=>{el.textContent=leftText(+el.dataset.dl-Date.now());});
},1000);

/* ================= Ereignisse ================= */
const ACT={
  start(){goPlay();},
  newGame(){ACT.local();},
  hostNew(){ACT.lead();},
  lead(){
    if(!P.ready){toast('Einen Moment, die Verbindung wird aufgebaut.');return;}
    if(!P.online){toast('Spiele leiten geht nur über den Spiel-Link mit Datenbank.');return;}
    if(P.isHost){unsub(listSubs);showScreen('mode');renderMode();return;}
    ACT.hostAccess();
  },
  hostAccess(){showModal(`<h3>Spiel leiten 🔒</h3><p>Dafür brauchst du den Zugangscode. Danach ist dieses Gerät dauerhaft freigeschaltet.</p><label class="field"><span>Code</span><input id="hostKey" type="password" autocomplete="off"></label><div class="stack" style="margin-top:12px"><button class="btn primary" data-act="hostLogin">Freischalten</button><button class="btn" data-act="closeModal">Abbrechen</button></div>`);},
  hostLogin(){hostLogin();},
  voteSkip(){const me=(L.intro||[]).find(x=>x.uid===P.uid);introVote({skip:!(me&&me.skip)});},
  introDone(){introDone();},
  startGroup(b){startGroupNow(b.dataset.gid);},
  skipGroup(b){adminSkip(b.dataset.code);},
  endGroup(b){adminEndGame(b.dataset.code);},
  closeSignup(){writeEvent({status:'closed'});},
  modeOnline(){if(P.online)createEvent();},
  modeLocal(){ACT.local();},
  local(){unsub(listSubs);showScreen('setup');renderNames();$('#localTime').innerHTML=timeSel(S.localTime??DEFAULT_TURN_TIME,'localTime');},
  tutorial(){startTutorial('solo');},
  count(b){S.count=+b.dataset.n;renderNames();},
  go(){const names=$$('#names input').map((i,k)=>i.value.trim()||'Spieler '+(k+1));
    S.pendingLocal={names,turnTime:S.localTime??DEFAULT_TURN_TIME};startTutorial('local');},
  tutSkip(){if(S.tutorial&&!S.introCode)endTutorial();},
  home(){closeModal();fingerHide();hideTip('tip');hideTip('tip2');S.tutorial=false;S.introCode=null;renderTutBanner();unsub(gameSubs);unsub(listSubs);unsub(eventSubs);unsub(dashSubs);E.ev=null;if(S.blitz)clearInterval(S.blitz.timer);S.blitz=null;S.tutorial=false;S.ended=false;S.players=null;S.online=false;$('#coach').classList.add('hidden');$('#toasts').innerHTML='';showScreen('start');},
  again(){startLocalGame(S.players.map(p=>p.name),S.turnTime);},
  tutStart(){S.tutorial=false;$('#coach').classList.add('hidden');fingerHide();ACT.home();},
  coachNext(){coachNext();},
  coachSkip(){ACT.tutStart();},
  create(){if(P.online)createGame();},
  share(){shareInvite();},
  join(b){if(P.online)joinGame(b.dataset.code);},
  rejoin(b){openLobby(b.dataset.code);},
  resume(b){resumeGame(b.dataset.code);},
  hostStart(){hostStart();},
  leaveLobby(){leaveLobby();},
  pickTeam(b){pickTeam(+b.dataset.team);},
  toggleTeams(b){toggleTeams(b.checked);},
  menu(){showModal(menuHTML());},
  closeModal(){closeModal();},
  rules(){showModal(rulesHTML());},
  pass(){if(userOK())passTurn();},
  skip(){if(!S.busy&&S.online&&!isMyTurn()&&!S.ended&&S.status==='playing')passTurn();},
  finish(){if(!S.busy)finishGame();},
  end(){if(userOK())actEndTurn();},
  ex1(){if(userOK())actExStart(1);},
  ex3(){if(userOK())actExStart(3);},
  exgo(){if(userOK())actExGo();},
  undo(){if(userOK())actUndo();},
  blitzGo(){blitzGo();},
  cancel(){if(userOK()){cancelMode();render();}},
  createEvent(){if(P.online)createEvent();},
  nameOk(){nameOk();},
  nameCancel(){closeModal();S.pick=null;L.eventInvite=null;if(S.screen==='event'&&!E.ev)ACT.home();},
  hostedJoin(b){if(P.online)startJoin(b.dataset.code);},
  takeSeat(b){takeSeat(b.dataset.gc,b.dataset.seat);},
  joinNew(){const pk=S.pick;closeModal();if(pk)enterEvent(pk.code,pk.name);},
  joinCode(){if(P.online)joinByCode();},
  openEvent(b){openEvent(b.dataset.code);},
  shareEvent(){shareEvent();},
  leaveEvent(){leaveEvent();},
  closeEvent(){closeEvent();},
  toggleAdminPlays(b){const on=b.checked;const ev=clone(E.ev);if(!on)ev.groups.forEach(g=>g.members=g.members.filter(m=>m!==P.uid));writeEvent({adminPlays:on,groups:ev.groups});},
  pickPerson(b,e){e&&e.stopPropagation();E.sel=E.sel===b.dataset.id?null:b.dataset.id;renderEvent();},
  toGroup(b){if(E.sel)assignPerson(E.sel,+b.dataset.gi);},
  toPool(){if(E.sel)assignPerson(E.sel,-1);},
  renameGroup(b,e){e&&e.stopPropagation();const gi=+b.dataset.gi,n=prompt('Name der Gruppe:',E.ev.groups[gi].name);if(n&&n.trim()){const g=clone(E.ev.groups);g[gi].name=n.trim().slice(0,24);writeEvent({groups:g});}},
  delGroup(b,e){e&&e.stopPropagation();const g=clone(E.ev.groups);g.splice(+b.dataset.gi,1);writeEvent({groups:g});},
  addGroup(){const g=clone(E.ev.groups);g.push({name:'Gruppe '+(g.length+1),members:[]});writeEvent({groups:g});},
  evSize(b){E.size=+b.dataset.n;renderEvent();},
  autoGroups(){autoGroups();},
  startEvent(){startEvent();},
  watchGroup(b){resumeGame(b.dataset.code);},
  toDash(){closeModal();unsub(gameSubs);if(E.ev&&E.code===S.eventCode)openDash();else openEvent(S.eventCode);},
  endEvent(){endEvent();},
  qrBig(b){showQrBig(b.dataset.kind,b.dataset.code);},
  lobbyTime(b){setLobbyTime(+b.dataset.t);},
  eventTime(b){writeEvent({turnTime:+b.dataset.t});},
  localTime(b){S.localTime=+b.dataset.t;$('#localTime').innerHTML=timeSel(S.localTime,'localTime');}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){const f=ACT[b.dataset.act];if(f)f(b,e);scheduleDraft();return;}
  if(e.target.id==='modal'&&!$('#modal').dataset.locked){closeModal();return;}
  if(!userOK())return;
  if(S.suppressClick){S.suppressClick=false;return;}
  const rt=e.target.closest('.tile[data-p]');if(rt){actSelect(rt.dataset.p==='b'?'b':+rt.dataset.p,+rt.dataset.slot);return;}
  const sl=e.target.closest('.tslot');
  if(sl){actSlotTap(sl.dataset.tid,sl.dataset.r==='c'?'c':+sl.dataset.r,+sl.dataset.k);return scheduleDraft();}
});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#board,.rack'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='nameIn'){nameOk();return;}if(e.key==='Enter'){if(S.screen==='setup')ACT.go();else if(S.screen==='play'&&P.online){if(e.target.id==='codeIn')joinByCode();else createGame();}}return;}
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden')&&!$('#modal').dataset.locked)return closeModal();
    if(userOK()){S.sel=null;cancelMode();render();}}
  if(e.key==='Enter'||e.key===' '){const t=e.target.closest?.('.tile[data-p]');if(t&&userOK()){e.preventDefault();actSelect(t.dataset.p==='b'?'b':+t.dataset.p,+t.dataset.slot);}}
});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.screen==='game'){layout();render();}},120);});

{const q=new URLSearchParams(location.search),inv=q.get('spiel'),ev=q.get('event');if(inv)L.invite=inv.toUpperCase().slice(0,8);if(ev)L.eventInvite=ev.toUpperCase().slice(0,8);}
if(L.eventInvite){showScreen('event');renderEvent();}else showScreen('start');
renderStart();
initPlatform();
